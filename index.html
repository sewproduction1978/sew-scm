<style>
:root{
  color-scheme:light;
  --bg:#f3f5f3; --panel:#ffffff; --panel-2:#f6f8f6; --border:#e2e7e3; --text:#17201a; --muted:#5e6a62; --faint:#8b968e;
  --brand:#178a3e; --brand-2:#0f6d30; --brand-soft:#e7f5ec; --brand-line:#b9e0c6;
  --red:#d33a32; --red-soft:#fdecea; --amber:#b9770e; --amber-soft:#fff4dc; --blue:#2a78d6; --blue-soft:#e8f1fc;

  --r:12px;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111513; --panel:#1a1f1c; --panel-2:#212824; --border:#2d3631; --text:#edf1ee; --muted:#a3ada6; --faint:#76817a;
  --brand:#3dbb68; --brand-2:#5fd086; --brand-soft:#1d3326; --brand-line:#2f5a3d;
  --red:#ef6b63; --red-soft:#3a1f1d; --amber:#e3a63a; --amber-soft:#3a2f17; --blue:#5b9cec; --blue-soft:#1c2a3d;

}
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg); color:var(--text); font:14px/1.45 'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit; color:inherit;}
h1,h2,h3{margin:0; font-family:'Oswald','Inter',sans-serif; font-weight:600; letter-spacing:.02em;}
a{color:var(--brand);}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
.muted{color:var(--muted);} .faint{color:var(--faint);}
.hide{display:none !important;}

.brand-img{width:46px; height:40px; flex-shrink:0;}
.splash{position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:var(--bg); transition:opacity .7s ease, visibility .7s ease;}
.splash.gone{opacity:0; visibility:hidden; pointer-events:none;}
.splash-glow{position:absolute; width:430px; height:430px; max-width:90vw; max-height:90vw; border-radius:50%; background:radial-gradient(circle, var(--brand-soft), transparent 70%); filter:blur(46px); animation:glow 3.2s ease-in-out infinite;}
@keyframes glow{0%,100%{transform:scale(1); opacity:.6;} 50%{transform:scale(1.16); opacity:1;}}
.splash-inner{position:relative; display:flex; flex-direction:column; align-items:center;}
.splash-logo{width:150px; height:130px; opacity:0; transform:scale(.74) translateY(14px); animation:logoIn 1s cubic-bezier(.16,1,.3,1) forwards;}
@keyframes logoIn{to{opacity:1; transform:scale(1) translateY(0);}}
.splash-title{font:700 42px 'Oswald',sans-serif; letter-spacing:.11em; margin-top:16px; opacity:0; animation:fadeUp .8s ease forwards; animation-delay:.5s;}
.splash-sub{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-top:5px; opacity:0; animation:fadeUp .8s ease forwards; animation-delay:.75s;}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.splash-loader{width:220px; height:3px; background:var(--panel-2); border-radius:2px; margin-top:30px; overflow:hidden; opacity:0; animation:fadeUp .6s ease forwards; animation-delay:1s;}
.splash-loader-fill{height:100%; width:0%; background:linear-gradient(90deg, var(--brand-2), var(--brand)); animation:load 1.5s cubic-bezier(.4,0,.2,1) forwards; animation-delay:1.05s;}
@keyframes load{to{width:100%;}}
.splash-tag{font-size:10px; letter-spacing:.09em; color:var(--muted); margin-top:14px; opacity:0; animation:fadeUp .6s ease forwards; animation-delay:2.1s;}

/* ---------- top bar ---------- */
.top{position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:12px; padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--border);}
.menu-btn{width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--panel-2); cursor:pointer; display:grid; place-items:center; font-size:18px;}
.brand{display:flex; align-items:center; gap:10px; min-width:0;}
.brand-logo{width:34px; height:34px; border-radius:9px; background:var(--brand); color:#fff; display:grid; place-items:center; font:700 13px 'Oswald',sans-serif; letter-spacing:.05em;}
.brand b{white-space:nowrap; font:600 18px 'Oswald',sans-serif; letter-spacing:.04em;}
.brand span{display:block; font-size:11px; color:var(--muted); margin-top:-2px;}
.top-right{margin-left:auto; display:flex; align-items:center; gap:8px;}
.chip{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:600; background:var(--panel-2); border:1px solid var(--border); color:var(--muted); white-space:nowrap;}
.chip.live{color:var(--brand); border-color:var(--brand-line); background:var(--brand-soft);}
.chip.demo{color:var(--amber); background:var(--amber-soft); border-color:transparent;}
.user-btn{border:1px solid var(--border); background:var(--panel-2); border-radius:999px; padding:5px 12px 5px 5px; display:flex; align-items:center; gap:8px; cursor:pointer;}
.user-btn i{width:28px; height:28px; border-radius:50%; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; font-style:normal; font-weight:700; font-size:12px;}
.user-btn small{display:block; font-size:10.5px; color:var(--muted); line-height:1;}
.user-btn b{font-size:12.5px; line-height:1.2;}

/* ---------- nav drawer ---------- */
.nav{position:fixed; left:0; top:0; bottom:0; width:262px; background:var(--panel); border-right:1px solid var(--border); z-index:80; padding:14px 12px; display:flex; flex-direction:column; gap:3px; transform:translateX(-104%); transition:transform .28s cubic-bezier(.16,1,.3,1); overflow-y:auto; box-shadow:var(--shadow);}
.nav.open{transform:none;}
.nav-bd{position:fixed; inset:0; background:rgba(10,16,13,.45); z-index:70; opacity:0; visibility:hidden; transition:opacity .25s;}
.nav-bd.show{opacity:1; visibility:visible;}
.nav-title{font:600 13px 'Oswald',sans-serif; letter-spacing:.12em; color:var(--brand); padding:4px 10px 10px; text-transform:uppercase;}
.ng-head{display:flex; align-items:center; gap:10px; width:100%; border:0; background:transparent; border-radius:10px; padding:9px 10px; cursor:pointer; font-weight:600; font-size:13px; text-align:left;}
.ng-head:hover,.ng.open>.ng-head{background:var(--panel-2);}
.ng-ico{width:26px; height:26px; border-radius:7px; background:var(--panel-2); display:grid; place-items:center; font-size:14px;}
.ng.has-active .ng-ico{background:var(--brand-soft);}
.ng-head .lbl{flex:1;}
.ng-head .chev{font-size:10px; color:var(--muted); transition:transform .2s;}
.ng.open .chev{transform:rotate(90deg);}
.ng-head .dot{width:8px; height:8px; border-radius:50%; background:var(--red); display:none;}
.ng.alert:not(.open) .dot{display:block;}
.ng-body{display:none; margin-left:22px; padding:2px 0 6px 10px; border-left:2px solid var(--border);}
.ng.open>.ng-body{display:block;}
.nb{display:flex; align-items:center; gap:8px; width:100%; border:1px solid transparent; background:transparent; color:var(--muted); border-radius:8px; padding:7px 10px; cursor:pointer; font-size:12.8px; text-align:left;}
.nb:hover{background:var(--panel-2); color:var(--text);}
.nb.active{background:var(--brand-soft); color:var(--brand); border-color:var(--brand-line); font-weight:600;}
.nb .badge{margin-left:auto;}
.nav-single{margin-bottom:2px;}
.nav-foot{margin-top:auto; padding-top:10px; border-top:1px solid var(--border); display:flex; gap:6px;}
.nav-foot button{flex:1;}

/* ---------- layout ---------- */
.wrap{max-width:1380px; margin:0 auto; padding:18px 18px 90px;}
.page{display:none;} .page.active{display:block; animation:pgIn .2s ease;}
@keyframes pgIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
.page-head{display:flex; align-items:center; gap:12px; margin:4px 0 16px; flex-wrap:wrap;}
.page-head h1{font-size:22px; text-transform:uppercase; border-left:4px solid var(--brand); padding-left:10px; line-height:1.1;}
.page-head .sub{color:var(--muted); font-size:12.5px;}
.page-head .actions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); margin-bottom:16px; min-width:0;}
.panel-head{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.panel-head h2{font-size:14.5px; text-transform:uppercase; letter-spacing:.05em;}
.panel-head .sub{color:var(--muted); font-size:12px;}
.panel-head .right{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.panel-body{padding:14px 16px;}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px;}
.grid2>.panel,.grid3>.panel{margin-bottom:0;}
.stack{display:flex; flex-direction:column; gap:16px; margin-bottom:16px;}

/* ---------- KPI tiles ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:16px;}
.kpi{background:var(--panel); border:1px solid var(--border); border-radius:var(--r); padding:14px 16px; box-shadow:var(--shadow); cursor:default; position:relative; overflow:hidden;}
.kpi[data-go]{cursor:pointer;} .kpi[data-go]:hover{border-color:var(--brand-line);}
.kpi .k{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600;}
.kpi .v{font:600 26px/1.15 'Oswald',sans-serif; margin-top:4px; font-variant-numeric:tabular-nums;}
.kpi .s{font-size:12px; color:var(--muted); margin-top:2px;}
.kpi.warn .v{color:var(--amber);} .kpi.bad .v{color:var(--red);} .kpi.good .v{color:var(--brand);}
.delta{font-weight:600;} .delta.up{color:var(--red);} .delta.down{color:var(--brand);}

/* ---------- forms ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--border); background:var(--panel-2); border-radius:9px; padding:8px 14px; cursor:pointer; font-weight:600; font-size:13px; white-space:nowrap;}
.btn:hover{border-color:var(--brand-line);}
.btn-brand{background:var(--brand); border-color:var(--brand); color:#fff;} .btn-brand:hover{background:var(--brand-2);}
[data-theme="dark"] .btn-brand{color:#0b1a10;}
.btn-danger{color:var(--red);} .btn-sm{padding:5px 10px; font-size:12px; border-radius:8px;}
.btn-ghost{background:transparent;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.icon-btn{border:0; background:transparent; cursor:pointer; padding:4px 6px; border-radius:6px; color:var(--muted); font-size:14px;}
.icon-btn:hover{background:var(--panel-2); color:var(--text);}
.field{display:flex; flex-direction:column; gap:4px; min-width:0;}
.field label{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
.inp,select.inp,textarea.inp{width:100%; border:1px solid var(--border); background:var(--panel-2); border-radius:9px; padding:8px 10px; outline:none; min-height:38px;}
.inp:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); background:var(--panel);}
.inp.bad{border-color:var(--red); box-shadow:0 0 0 3px var(--red-soft);}
select.inp{cursor:pointer;}
select option,select optgroup{background:#fff !important; color:#17201a !important;}
[data-theme="dark"] select option,[data-theme="dark"] select optgroup{background:#1e2420 !important; color:#edf1ee !important;}
.form-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px;}
.form-grid .wide{grid-column:span 2;}
.filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.filters .inp{width:auto; min-width:140px;}
.filters .search{min-width:220px; flex:1;}
.seg{display:inline-flex; background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px; flex-wrap:wrap;}
.seg button{border:0; background:transparent; padding:6px 12px; border-radius:7px; cursor:pointer; font-weight:600; font-size:12.5px; color:var(--muted);}
.seg button.on{background:var(--panel); color:var(--brand); box-shadow:0 1px 3px rgba(0,0,0,.1);}
.chk{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer;}

/* ---------- tables ---------- */
.tw{overflow:auto; max-width:100%;}
.tw.tall{max-height:560px;}
table.t{width:100%; border-collapse:collapse; font-size:13px;}
.t th{position:sticky; top:0; background:var(--panel-2); z-index:1; text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
.t th.sortable{cursor:pointer;} .t th.sortable:hover{color:var(--text);}
.t td{padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
.t tbody tr:hover td{background:var(--panel-2);}
.t tr.click{cursor:pointer;}
.t tfoot td{font-weight:700; background:var(--panel-2); border-top:2px solid var(--border);}
.t .inp{min-height:32px; padding:5px 8px;}
.t td.act{white-space:nowrap; text-align:right; width:1%;}
.empty{padding:28px 16px; text-align:center; color:var(--muted);}
.badge{display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; background:var(--panel-2); color:var(--muted); border:1px solid var(--border);}
.badge.ok{background:var(--brand-soft); color:var(--brand); border-color:transparent;}
.badge.warn{background:var(--amber-soft); color:var(--amber); border-color:transparent;}
.badge.bad{background:var(--red-soft); color:var(--red); border-color:transparent;}
.badge.info{background:var(--blue-soft); color:var(--blue); border-color:transparent;}
.tag{display:inline-block; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:5px; background:var(--panel-2); color:var(--muted); margin-left:4px; vertical-align:1px;}
.note{font-size:12.5px; color:var(--muted);}
.tip{font-size:12.5px; color:var(--muted); background:var(--panel-2); border-radius:9px; padding:8px 12px; margin-bottom:12px;}

/* ---------- entry sheet ---------- */
.sheet td{padding:5px 6px;}
.sheet .ac{min-width:260px;}
.sheet .q{width:110px;} .sheet .r{width:110px;}
.sheet .stock{font-size:11.5px; color:var(--muted); white-space:nowrap;}
.sheet-foot{display:flex; align-items:center; gap:10px; padding:12px 16px; border-top:1px solid var(--border); flex-wrap:wrap;}
.sheet-foot .total{margin-left:auto; font-weight:700;}

/* ---------- autocomplete ---------- */
.ac-list{position:fixed; z-index:200; background:var(--panel); border:1px solid var(--brand-line); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,.25); max-height:300px; overflow:auto; min-width:280px;}
.ac-item{padding:7px 11px; cursor:pointer; font-size:13px; display:flex; gap:8px; align-items:baseline;}
.ac-item small{color:var(--muted); margin-left:auto; white-space:nowrap; font-size:11px;}
.ac-item.on,.ac-item:hover{background:var(--brand-soft);}
.ac-item .tp{font-size:10px; font-weight:700; color:var(--muted); background:var(--panel-2); border-radius:4px; padding:0 5px;}
.ac-new{color:var(--brand); font-weight:600;}

/* ---------- charts ---------- */
.chart{width:100%; position:relative;}
.chart svg{display:block; width:100%; height:auto; overflow:visible;}
.chart .gl{stroke:var(--border); stroke-width:1;}
.chart .ax{fill:var(--muted); font-size:11px;}
.chart .lbl{fill:var(--text); font-size:11px; font-weight:600;}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--muted); margin-bottom:8px;}
.legend span{display:inline-flex; align-items:center; gap:6px;}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block;}
.vtip{position:fixed; z-index:300; pointer-events:none; background:var(--panel); border:1px solid var(--border); box-shadow:0 8px 24px rgba(0,0,0,.2); border-radius:9px; padding:8px 10px; font-size:12px; min-width:140px; display:none;}
.vtip b{display:block; margin-bottom:4px;}
.vtip .r{display:flex; gap:10px; justify-content:space-between;}
.vtip i{width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:5px;}
.bar-row{display:grid; grid-template-columns:minmax(120px,38%) 1fr auto; gap:10px; align-items:center; padding:5px 0; font-size:12.5px;}
.bar-row .bn{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bar-row .bt{height:12px; background:var(--panel-2); border-radius:4px; overflow:hidden;}
.bar-row .bf{display:block; height:100%; border-radius:0 4px 4px 0; background:var(--s1);}
.bar-row .bv{font-variant-numeric:tabular-nums; font-weight:600; min-width:80px; text-align:right;}

/* ---------- OT grid ---------- */
.gh{font:600 12.5px 'Inter',sans-serif; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 0 8px;}
table.grid td{padding:2px; border-right:1px solid var(--border);}
table.grid th.dcol{text-align:center; padding:6px 2px; font-size:11px; min-width:40px;}
table.grid th.dcol span{font-size:9.5px; color:var(--faint); font-weight:500;}
table.grid .sun{background:var(--amber-soft);}
table.grid .stk{position:sticky; left:0; background:var(--panel); z-index:2; white-space:nowrap; padding:6px 10px; min-width:130px;}
table.grid thead .stk{background:var(--panel-2); z-index:3;}
table.grid tfoot .stk{background:var(--panel-2);}
.gin{width:40px; border:1px solid transparent; background:transparent; text-align:center; padding:5px 2px; border-radius:5px; font-size:12.5px; font-variant-numeric:tabular-nums;}
.gin:hover{border-color:var(--border);}
.gin:focus{outline:none; border-color:var(--brand); background:var(--panel); box-shadow:0 0 0 2px var(--brand-soft);}
.gin.bad{border-color:var(--red);}
.gin[readonly]{cursor:default;}

/* ---------- modal & toast ---------- */
.modal-bd{position:fixed; inset:0; background:rgba(10,16,13,.5); z-index:150; display:none; align-items:flex-start; justify-content:center; padding:5vh 14px; overflow:auto;}
.modal-bd.show{display:flex;}
.modal{background:var(--panel); border-radius:14px; width:min(760px,100%); box-shadow:0 20px 60px rgba(0,0,0,.35); border:1px solid var(--border);}
.modal.wide{width:min(1100px,100%);}
.modal-head{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border);}
.modal-head h2{font-size:16px; text-transform:uppercase;}
.modal-head .x{margin-left:auto;}
.modal-body{padding:16px 18px;}
.modal-foot{display:flex; gap:8px; justify-content:flex-end; padding:12px 18px; border-top:1px solid var(--border);}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:#17201a; color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; z-index:400; opacity:0; transition:.25s; pointer-events:none; max-width:92vw;}
.toast.show{opacity:1; transform:translateX(-50%);}
.toast.err{background:var(--red);}

/* ---------- login ---------- */
.login{position:fixed; inset:0; z-index:500; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:16px;}
.login-card{background:var(--panel); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); width:min(400px,100%); padding:26px;}
.login-card h1{font-size:24px; margin:10px 0 2px;}
.login-card .form-grid{grid-template-columns:1fr; margin-top:18px;}
.login-err{color:var(--red); font-size:12.5px; min-height:18px; margin-top:8px;}

/* ---------- item card ---------- */
.ic-head{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start;}
.ic-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:12px 0;}
.ic-stats div{background:var(--panel-2); border-radius:10px; padding:9px 12px;}
.ic-stats span{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600;}
.ic-stats b{font:600 18px 'Oswald',sans-serif;}

/* ---------- responsive ---------- */
@media (max-width:980px){ .grid2,.grid3{grid-template-columns:1fr;} }
@media (max-width:640px){
  .wrap{padding:12px 12px 90px;}
  .top{padding:8px 12px;}
  .brand span,.user-btn .who{display:none;}
  .page-head h1{font-size:19px;}
  .form-grid{grid-template-columns:1fr 1fr;} .form-grid .wide{grid-column:span 2;}
  .filters .inp,.filters .search{min-width:0; flex:1 1 45%;}
  .kpi .v{font-size:22px;}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
  .kpi{padding:11px 12px;}
  .bar-row{grid-template-columns:minmax(90px,40%) 1fr auto;}
}

/* entry sheets become cards on phones */
@media (max-width:640px){
  table[data-sheet] thead{display:none;}
  table[data-sheet], table[data-sheet] tbody{display:block;}
  table[data-sheet] tr{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; padding:10px 12px; border-bottom:1px solid var(--border); position:relative;}
  table[data-sheet] td{border:0 !important; padding:0 !important; width:auto !important; min-width:0 !important;}
  table[data-sheet] td:first-child{display:none;}
  table[data-sheet] td.ac{grid-column:1/-1; padding-right:30px !important;}
  table[data-sheet] td.stock{grid-column:1/-1;}
  table[data-sheet] td.stock:empty{display:none;}
  table[data-sheet] td[data-val]{align-self:center;}
  table[data-sheet] td.act{position:absolute; top:12px; right:6px;}
  table[data-sheet] tbody tr:hover td{background:transparent;}
  .chip.demo{max-width:120px; overflow:hidden; text-overflow:ellipsis;}
}
.recent{list-style:none; margin:0; padding:0;}
.recent li{display:grid; grid-template-columns:52px 1fr auto; gap:10px; padding:9px 16px; border-bottom:1px solid var(--border); align-items:center; font-size:13px;}
.recent li:last-child{border-bottom:0;}
.recent .d{font-size:11.5px; color:var(--muted); line-height:1.2;}
.recent .n{min-width:0;} .recent .n b{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600;}
.recent .n small{color:var(--muted); font-size:11.5px;}
.recent .q{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
.recent .q small{display:block; color:var(--muted); font-size:11.5px;}

/* ---------- print ---------- */
@media print{
  @page{size:A4 landscape; margin:10mm;}
  :root,[data-theme="dark"]{color-scheme:light;
  --bg:#f3f5f3; --panel:#ffffff; --panel-2:#f6f8f6; --border:#e2e7e3; --text:#17201a; --muted:#5e6a62; --faint:#8b968e;
  --brand:#178a3e; --brand-2:#0f6d30; --brand-soft:#e7f5ec; --brand-line:#b9e0c6;
  --red:#d33a32; --red-soft:#fdecea; --amber:#b9770e; --amber-soft:#fff4dc; --blue:#2a78d6; --blue-soft:#e8f1fc;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --sOther:#9aa39c;
  --shadow:0 1px 2px rgba(16,24,20,.05),0 4px 14px rgba(16,24,20,.05);
  --r:12px;
    --bg:#fff; --panel:#fff; --panel-2:#f4f4f4; --text:#000; --muted:#444; --border:#ccc; --shadow:none;}
  .top,.nav,.nav-bd,.page-head .actions,.panel-head .right,.no-print,.toast,.btn,.icon-btn,.filters{display:none !important;}
  .page:not(.active){display:none !important;}
  .panel{box-shadow:none; break-inside:avoid;}
  .tw,.tw.tall{max-height:none; overflow:visible;}
  .print-head{display:block !important;}
  body{background:#fff;}
}
.print-head{display:none; font-size:12px; margin-bottom:10px;}

/* ===================== AHL supply planning sheets ===================== */
.sp-tw{max-height:calc(100vh - 230px); overflow:auto;}
table.sp-x{border-collapse:separate; border-spacing:0; font-size:12px; width:max-content; min-width:100%;}
.sp-x th,.sp-x td{border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:3px 6px; white-space:nowrap; background:var(--panel); height:24px;}
.sp-x thead th{position:sticky; top:0; z-index:3; background:#1f4e78; color:#fff; font-weight:600; font-size:11.5px; text-align:center; white-space:normal; min-width:34px; line-height:1.2;}
.sp-x thead tr.sp-dow th{top:0; background:#d9e1f2; color:#1f3864; font-weight:500; font-size:10.5px; height:18px;}
.sp-x thead tr.sp-dow + tr th{top:24px;}
.sp-x thead tr.sp-grp th{background:#305496;} .sp-x thead tr.sp-grp + tr th{top:24px;}
.sp-x thead th.sun{background:#7f7f7f; color:#fff;} .sp-x thead tr.sp-dow th.sun{background:#bfbfbf; color:#333;}
.sp-x th.off,.sp-x td.off{background:var(--panel-2) !important; color:transparent;}
.sp-x td.sun{background:#f2f2f2;} [data-theme="dark"] .sp-x td.sun{background:#262b28;}
.sp-x tfoot td{position:sticky; bottom:0; z-index:2; background:#ddebf7; font-weight:600; color:#000;}
.sp-x .n{text-align:right; font-variant-numeric:tabular-nums;} .sp-x .c{text-align:center;} .sp-x .b{font-weight:700;}
.sp-stk2{position:sticky; z-index:2;}
.sp-stk2{left:0;}
.sp-x th.sp-stk0,.sp-x th.sp-stk1,.sp-x th.sp-stk2{z-index:4;}
.sp-x tfoot td.sp-stk0,.sp-x tfoot td.sp-stk1,.sp-x tfoot td.sp-stk2{z-index:3;}
.sp-x .sp-stk2{box-shadow:2px 0 0 var(--border);}
.sp-name{max-width:230px; overflow:hidden; text-overflow:ellipsis;}
.sp-x td:has(> input.spin){padding:0; background:#fff2cc;} [data-theme="dark"] .sp-x td:has(> input.spin){background:#3a3420;}
.sp-x td.sun:has(> input.spin){background:#eadfb9;}
input.spin{width:46px; height:23px; border:0; background:transparent; text-align:right; font:inherit; padding:0 4px; color:var(--text);}
input.spin:focus{outline:2px solid var(--brand); outline-offset:-2px; background:#fff;} input.spin[readonly]{cursor:default;}
input.spin.bad,.sp-pin.bad{background:#ffc7ce !important;}
.sp-pin{font:inherit; font-size:12px; border:1px solid var(--border); border-radius:4px; padding:2px 5px; background:#fffbe6; color:var(--text);}
[data-theme="dark"] .sp-pin{background:#2b2a20;} .sp-pin[readonly],.sp-pin:disabled{background:transparent; border-color:transparent; color:var(--text); opacity:1;}
.sp-pin.n{text-align:right;} .w4{width:46px}.w5{width:56px}.w6{width:66px}.w7{width:80px}.w9{width:104px}.w10{width:120px}.w12{width:150px}.w22{width:240px}
.sp-auto{background:#e2efda !important; color:#000;} .sp-yel{background:#fff2cc !important;}
.sp-sub td{background:var(--panel-2);} .sp-subl{color:var(--muted); font-style:italic;}
.sp-hdrrow td{background:var(--panel-2);}
.sp-ok{color:#006100; background:#c6efce !important;} .sp-bad{color:#9c0006; background:#ffc7ce !important;}
.sp-gr{background:#c6efce !important; color:#006100;} .sp-rd{background:#ffc7ce !important; color:#9c0006;} .sp-gr2{background:#e2efda !important; color:#375623;}
.sp-or{background:#fce4d6 !important; color:#833c0b;} .sp-yl{background:#ffeb9c !important; color:#7f6000;} .sp-rdt{color:#c00000 !important; font-weight:600;}
.sp-st-ok{background:#c6efce !important; color:#006100; font-weight:600;} .sp-st-or{background:#ffeb9c !important; color:#9c5700; font-weight:600;}
.sp-st-rd{background:#ffc7ce !important; color:#9c0006; font-weight:600;} .sp-st-yl{background:#ddebf7 !important; color:#1f4e78; font-weight:600;}
.sp-lab{font-weight:600; font-size:11.5px;}
tr.sp-ahl td{background:#ddebf7; color:#000;} tr.sp-ahl.sp-blk td{border-top:2px solid #1f4e78;}
tr.sp-net td{background:#f2f2f2; color:#000;}
tr.sp-pp td{background:#fbe5d6; color:#000;} tr.sp-vp td{background:#ede7f6; color:#000;}
tr.sp-cov td{background:#f3eaf9; color:#5b2c83;} tr.sp-cl td{background:#fff; color:#000; font-weight:600;}
[data-theme="dark"] tr.sp-ahl td,[data-theme="dark"] tr.sp-net td,[data-theme="dark"] tr.sp-pp td,[data-theme="dark"] tr.sp-vp td,[data-theme="dark"] tr.sp-cov td,[data-theme="dark"] tr.sp-cl td{filter:brightness(.92);}
.sp-x tr td.sp-gr,.sp-x tr td.sp-rd{font-weight:600;}
.sp-sec td{background:#1f4e78 !important; color:#fff; font-weight:600;}
.sp-holrow td{background:#fff;} .sp-hol{background:#7f7f7f !important; color:#fff; font-weight:700;}
.sp-del{background:#c6e0b4 !important; font-weight:600; color:#000;} .sp-dday{background:#ebf1de !important;}
.sp-lot{background:#c6e0b4 !important; font-weight:700; color:#000;}
.sp-sel td{background:var(--brand-soft) !important;}
.sp-sumt{min-width:100%;} .sp-sumt td{white-space:normal;}
/* printable paper (vendor schedule / performance report) */
.sp-paper{background:#fff; color:#000; border:1px solid var(--border); border-radius:10px; padding:22px 24px; overflow:auto;}
.sp-paper .sp-x th,.sp-paper .sp-x td{background-clip:padding-box;} .sp-paper .sp-x td{background:#fff; color:#000;}
.sp-paper .sp-x thead th{position:static;} .sp-paper .sp-x tfoot td{position:static;}
.sp-co{text-align:center; font-size:20px; font-weight:800; letter-spacing:.04em; color:#1f4e78;}
.sp-co2{text-align:center; font-size:14px; font-weight:600; margin:2px 0 14px;}
.sp-hdr{display:flex; gap:24px; flex-wrap:wrap; justify-content:space-between; margin-bottom:14px;}
.sp-kv{border-collapse:collapse; font-size:12.5px;} .sp-kv th{text-align:left; padding:3px 10px 3px 0; color:#333; white-space:nowrap;} .sp-kv td{padding:3px 8px; border-bottom:1px solid #ddd; min-width:180px;}

function applyRecord(coll, id, data, deleted) {

  const arr = DB[coll], i = arr.findIndex(x => x.id === id);

async function put(coll, objs) {
  objs = Array.isArray(objs) ? objs : [objs];
  if (!objs.length) return true;
  const now = new Date().toISOString();
  objs.forEach(o => { if (!o.id) o.id = uid(coll[0]); if (!o.createdAt) { o.createdAt = now; o.createdBy = S.name; } o.updatedAt = now; o.updatedBy = S.name; applyRecord(coll, o.id, o, false); });
  bump();
  if (S.mode === "demo") { demoSave(); return true; }
  for (let i = 0; i < objs.length; i += 400) {
    const rows = objs.slice(i, i + 400).map(o => ({ coll, id: o.id, data: o, deleted: false }));
    const { error } = await S.sb.from("scm_records").upsert(rows, { onConflict: "coll,id" });

  }

}

  const rows = olds.map(o => ({ coll, id: o.id, data: Object.assign({}, o, { deletedBy: S.name, deletedAt: new Date().toISOString() }), deleted: true }));
  const { error } = await S.sb.from("scm_records").upsert(rows, { onConflict: "coll,id" });

let IX = null;

  DB.prices.forEach(p => (X.prices[p.itemId] = X.prices[p.itemId] || []).push(p));
  Object.values(X.prices).forEach(a => a.sort((x, y) => (y.from || "").localeCompare(x.from || "") || (y.createdAt || "").localeCompare(x.createdAt || "")));

  DB.items.forEach(i => X.st[i.id] = { q: 0, avg: 0, vendor: 0, lastIn: "", lastOut: "", lastIssue: "", issued: 0 });
  X.txSorted.forEach(t => {

    } else if (t.type === "ret" || t.type === "st_in") {

    } else if (t.type === "adjust") {

    } else { // issue, dispatch, st_out, scrap
      const r = ref(); s.q -= q; t._val = q * r; t._rate = r; s.lastOut = t.date;

/* price for an item (optionally from one supplier) on a date: the newest quote that has started */

/* ---------------- autocomplete (list floats on <body>, never clipped) ---------------- */
let AC = null;
function acAttach(inp, opt) {
  inp.setAttribute("autocomplete", "off");

  inp.addEventListener("focus", open);
  inp.addEventListener("input", () => { if (opt.onType) opt.onType(inp.value); open(); });
  inp.addEventListener("keydown", e => {
    if (!AC || AC.inp !== inp) { if (e.key === "ArrowDown") open(); return; }
    const its = $$(".ac-item", AC.box);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); AC.i = Math.max(0, Math.min(its.length - 1, AC.i + (e.key === "ArrowDown" ? 1 : -1))); its.forEach((x, k) => x.classList.toggle("on", k === AC.i)); its[AC.i] && its[AC.i].scrollIntoView({ block: "nearest" }); }
    else if (e.key === "Enter") { if (its[AC.i]) { e.preventDefault(); its[AC.i].dispatchEvent(new MouseEvent("mousedown", { bubbles: true })); } }
    else if (e.key === "Escape" || e.key === "Tab") acClose();

}
function acOpen(inp, opt) {

  let list = opt.source().filter(o => !toks.length || toks.every(t => o.hay.includes(t)));

  box.innerHTML = list.map((o, k) => `<div class="ac-item${k === 0 ? " on" : ""}" data-k="${k}">${o.tag ? `<span class="tp">${esc(o.tag)}</span>` : ""}<span>${esc(o.label)}</span><small>${esc(o.right || "")}</small></div>`).join("")
    + (total > 60 ? `<div class="ac-item faint" style="cursor:default">… ${total - 60} more — type to narrow</div>` : "")
    + (opt.onNew && q ? `<div class="ac-item ac-new" data-new="1">＋ Add “${esc(inp.value.trim())}” as a new ${opt.newLabel || "item"}</div>` : "")
    + (!list.length && !(opt.onNew && q) ? `<div class="ac-item faint">No match</div>` : "");
  document.body.appendChild(box);
  AC = { inp, box, i: 0 };
  const place = () => { const r = inp.getBoundingClientRect(); const h = Math.min(300, box.scrollHeight); const below = window.innerHeight - r.bottom; box.style.left = Math.max(6, Math.min(r.left, window.innerWidth - Math.max(r.width, 280) - 6)) + "px"; box.style.width = Math.max(r.width, 280) + "px"; box.style.top = (below < h + 10 && r.top > below ? r.top - h - 4 : r.bottom + 4) + "px"; };
  place(); AC.place = place;
  box.addEventListener("mousedown", e => {
    e.preventDefault();

    if (it.dataset.new) { acClose(); opt.onNew(inp.value.trim()); return; }

}

/* stacked columns: cats = x labels, series = [{name,color,values[]}] */
function stackedBars(cats, series, fmt = rsK, h = 240) {
  const W = 760, H = h, L = 62, R = 10, T = 12, B = 28;
  const tot = cats.map((_, i) => series.reduce((a, s) => a + Math.max(0, s.values[i] || 0), 0));
  const stp = niceStep(Math.max(1, ...tot) / 4); const nT = Math.max(1, Math.ceil(Math.max(1, ...tot) / stp)); const max = stp * nT; const bw = Math.min(46, (W - L - R) / cats.length * 0.62); const step = (W - L - R) / cats.length;
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = "";
  for (let k = 0; k <= nT; k++) { const v = stp * k; g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${esc(fmtAxis(v, fmt))}</text>`; }
  cats.forEach((c, i) => {
    const x = L + step * i + (step - bw) / 2; let acc = 0;
    const tip = `<b>${esc(c)}</b>` + series.filter(s => s.values[i]).map(s => `<div class="r"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><span>${esc(fmt(s.values[i]))}</span></div>`).join("") + (series.length > 1 ? `<div class="r" style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px"><span>Total</span><b>${esc(fmt(tot[i]))}</b></div>` : "");
    const segs = series.map(s => ({ s, v: Math.max(0, s.values[i] || 0) })).filter(o => o.v > 0);
    segs.forEach((o, k) => {
      const y1 = y(acc + o.v), y0 = y(acc); acc += o.v; const top = k === segs.length - 1;
      const hh = Math.max(0, y0 - y1 - (top ? 0 : 2));
      g += top ? `<path d="M${x},${y0} V${y1 + Math.min(4, hh)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${y0} Z" fill="${o.s.color}"/>` : `<rect x="${x}" y="${y1 + 2}" width="${bw}" height="${hh}" fill="${o.s.color}"/>`;
    });
    g += `<rect x="${L + step * i}" y="${T}" width="${step}" height="${H - T - B}" fill="transparent" data-tip="${esc(tip)}"/>`;
    g += `<text class="ax" x="${L + step * i + step / 2}" y="${H - 8}" text-anchor="middle">${esc(c)}</text>`;
  });
  return `${legend(series.map(s => s.name), series.map(s => s.color))}<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div>`;

function lineChart(cats, series, fmt = rsRate, h = 200) {
  const W = 760, H = h, L = 62, R = 14, T = 12, B = 28;
  const vals = series.flatMap(s => s.values.filter(v => v != null));
  if (!vals.length) return `<div class="empty">No data yet</div>`;
  let mn = Math.min(...vals), mx = Math.max(...vals); if (mn === mx) { mn = mn * 0.9; mx = mx * 1.1 || 1; } const pad = (mx - mn) * 0.15; mn = Math.max(0, mn - pad); mx += pad;
  const step = cats.length > 1 ? (W - L - R) / (cats.length - 1) : 0; const X = i => cats.length > 1 ? L + step * i : (L + W - R) / 2; const Y = v => T + (H - T - B) * (1 - (v - mn) / (mx - mn));

  for (let k = 0; k <= 4; k++) { const v = mn + (mx - mn) * k / 4; g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${esc(fmtAxis(v, fmt))}</text>`; }

  cats.forEach((c, i) => { if (i % every === 0 || i === cats.length - 1) g += `<text class="ax" x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc(c)}</text>`; });
  series.forEach(s => {
    let d = "", last = null;
    s.values.forEach((v, i) => { if (v == null) { if (s.step && last != null) v = last; else return; } d += (d ? (s.step ? ` H${X(i)} V${Y(v)}` : ` L${X(i)},${Y(v)}`) : `M${X(i)},${Y(v)}`); last = v; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    s.values.forEach((v, i) => { if (v != null && (s.dots !== false)) g += `<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>`; });
  });
  cats.forEach((c, i) => { const tip = `<b>${esc(c)}</b>` + series.filter(s => s.values[i] != null).map(s => `<div class="r"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><span>${esc(fmt(s.values[i]))}</span></div>`).join(""); g += `<rect x="${X(i) - Math.max(step, 20) / 2}" y="${T}" width="${Math.max(step, 20)}" height="${H - T - B}" fill="transparent" data-tip="${esc(tip)}"/>`; });

function importItems() {

      const ex = DB.items.find(i => i.name.toLowerCase() === r.name.toLowerCase() && (i.model || "") === r.model);
      const it = Object.assign(ex ? Object.assign({}, ex) : { id: uid("i"), active: true, depts: [] }, { name: r.name, type: TYPES[r.type] ? r.type : "indirect", uom: r.uom }, r.code ? { code: r.code } : {}, r.category ? { category: r.category } : {}, r.model ? { model: r.model } : {}, sp ? { supplierId: sp.id } : {}, r.min ? { min: r.min } : {});

function parseCSV(t) { const out = []; let row = [], f = "", q = false; t = t.replace(/^﻿/, ""); for (let i = 0; i < t.length; i++) { const c = t[i]; if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; } else if (c === '"') q = true; else if (c === ",") { row.push(f); f = ""; } else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(f); out.push(row); row = []; f = ""; } else f += c; } if (f || row.length) { row.push(f); out.push(row); } return out; }

/* ======================= AHL Supply Planning — calculation engine =======================
   A line-for-line port of AHL_Supply_Planning_Workbook.xlsx. Every number the workbook works
   out (Part Master MIN/MAX, in-house & vendor plan blocks, automatic vendor lots, delivery
   calendar & QC load, comprehensive tracker, daily stock, month-end, summary) is computed
   here from the same inputs and the same rules. Column letters of the workbook are noted. */
const SP_WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function spDaysIn(ym) { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); }
function spDate(ym, d) { return ym + "-" + String(d).padStart(2, "0"); }
function spDow(ym, d) { const [y, m] = ym.split("-").map(Number); return new Date(y, m - 1, d).getDay(); }
function spAddDays(iso, n) { const [y, m, d] = iso.split("-").map(Number); const t = new Date(Date.UTC(y, m - 1, d + n)); return t.toISOString().slice(0, 10); }
const spN = v => { const x = typeof v === "number" ? v : parseFloat(v); return isFinite(x) ? x : 0; };
const spRoundUp100 = x => x <= 0 ? 0 : Math.ceil(x / 100 - 1e-12) * 100;          // ROUNDUP(x,-2)
const spCeil = (x, m) => m > 0 ? Math.ceil(x / m - 1e-12) * m : x;                 // CEILING(x,m)
const spMon = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const spDdMmm = (ym, d) => String(d).padStart(2, "0") + "-" + spMon[+ym.slice(5) - 1];

/* inp = { cfg, parts:[...ordered], ym, rd, month:{holidays,opening}, ahl:{pid:{d}}, saad:[{name,sched,d}],
           rcv:{pid:{vkey:{d}}}, rej:{pid:{vkey:{d}}}, dsp:{pid:{d}}, cnt:{pid:{count,remark}} } */
function spCompute(inp) {
  const { cfg, ym } = inp; const N = spDaysIn(ym);
  const rd = inp.rd, rdla = spAddDays(rd, spN(cfg.lookAhead));
  const days = Array.from({ length: N }, (_, i) => i + 1);
  const isSun = d => spDow(ym, d) === 0;
  const upTo = lim => days.filter(d => spDate(ym, d) <= lim).length;         // days of the month dated <= lim
  const D_rd = upTo(rd), D_la = upTo(rdla);
  const workDays = cfg.workDays != null && cfg.workDays !== "" ? spN(cfg.workDays) : N - days.filter(isSun).length;   // Settings B7
  const minDays = spN(cfg.minDays), maxDays = cfg.maxDays != null && cfg.maxDays !== "" ? spN(cfg.maxDays) : workDays; // B8, B9
  const lotDef = Math.max(1, spN(cfg.defaultLot)), buffer = spN(cfg.bufferPct), qcCap = spN(cfg.qcCap);
  const parts = inp.parts.filter(p => p.name);
  const sum = (o, a, b) => { let s = 0; for (let d = a; d <= b; d++) s += spN(o && o[d]); return s; };
  const R = { ym, N, days, rd, rdla, D_rd, D_la, workDays, minDays, maxDays, part: {}, list: [], vendors: [], cal: {}, qc: {}, summary: {} };

  /* ---------- Part Master + sheets 1, 5, 6 ---------- */
  parts.forEach(p => {

/* keyboard + paste for every editable grid */
function spBindGrid(el, onCell) {
  const ins = $$("input.spin", el);
  ins.forEach(inp => {
    inp.addEventListener("focus", () => { try { inp.select(); } catch (e) {} });
    inp.addEventListener("change", () => onCell(inp));
    inp.addEventListener("keydown", e => {
      const r = +inp.dataset.r, c = +inp.dataset.c, tb = inp.closest("table"), at = (rr, cc) => tb.querySelector(`input.spin[data-r="${rr}"][data-c="${cc}"]`); let t = null;
      if (e.key === "Enter" || e.key === "ArrowDown") { for (let k = r + 1; k < r + 40 && !t; k++) t = at(k, c); }
      else if (e.key === "ArrowUp") { for (let k = r - 1; k > r - 40 && k >= 0 && !t; k--) t = at(k, c); }
      else if (e.key === "ArrowRight" && inp.selectionStart === inp.value.length) t = at(r, c + 1);
      else if (e.key === "ArrowLeft" && inp.selectionStart === 0) t = at(r, c - 1);
      if (t) { e.preventDefault(); t.focus(); }
    });
    inp.addEventListener("paste", e => {
      const txt = (e.clipboardData || window.clipboardData).getData("text"); if (!txt || !/[\t\n]/.test(txt.trim())) return; e.preventDefault();
      const tb = inp.closest("table"), r = +inp.dataset.r, c = +inp.dataset.c; let n = 0;
      const rowsAll = [...new Set($$("input.spin", tb).map(x => +x.dataset.r))].sort((a, b) => a - b); const ri = rowsAll.indexOf(r);
      txt.replace(/\r/g, "").split("\n").filter((l, i, a) => l !== "" || i < a.length - 1).forEach((ln, i) => ln.split("\t").forEach((v, j) => { const rr = rowsAll[ri + i]; if (rr == null) return; const t = tb.querySelector(`input.spin[data-r="${rr}"][data-c="${c + j}"]`); if (t && !t.readOnly) { t.value = v.trim(); onCell(t, true); n++; } }));
      toast(`Pasted ${n} cells`); setTimeout(render, 700);
    });
  });
}

      <td class="n b">${spF(tot)}</td><td class="n">${r.sched === "" || r.sched == null ? "" : spF(tot - num(r.sched))}</td><td class="${P && P.blk ? spCovCls(P.blk.cover) : ""}">${P && P.blk ? esc(P.blk.cover) : ""}</td><td class="${P && P.blk ? spCovCls(P.blk.covMsg) : ""}">${P && P.blk ? esc(P.blk.covMsg) : ""}</td></tr>`; }).join("");
  el.innerHTML = spBar(T, "Saad types his daily production plan here; it fills the Production Plan row on sheet 2") + `<div class="panel"><div class="panel-head">${spFind("spf")}<div class="right">${ro ? "" : `<button class="btn btn-sm btn-brand" id="saAdd">＋ Row</button>`}</div></div>
    <div class="tw sp-tw"><table class="sp-x"><thead>${spDayHead(ymv, '<th></th><th class="sp-stk2"></th><th></th><th></th><th></th><th></th>')}<th></th><th></th><th></th><th></th></tr><tr><th>Sr#</th><th class="sp-stk2">Part Name (as in Part Master)</th><th>Saad's name for the part</th><th>Department</th><th>Schedule (Saad target)</th><th>Link check</th>${spDateHead(ymv)}<th>Total Plan</th><th>Total − Schedule</th><th>AHL covered till (sheet 2)</th><th>AHL shortage (sheet 2)</th></tr></thead>
    <tbody>${body || `<tr><td colspan="40" class="empty">No rows yet</td></tr>`}</tbody><tfoot><tr><td></td><td class="sp-stk2 b">TOTAL</td><td></td><td></td><td class="n">${spF(rows.reduce((a, r) => a + num(r.sched), 0))}</td><td></td>${ds.map(x => `<td class="n">${colTot[x.d] ? spF(colTot[x.d]) : ""}</td>`).join("")}<td class="n b">${spF(Object.values(colTot).reduce((a, b) => a + b, 0))}</td><td></td><td></td><td></td></tr></tfoot></table></div></div>`;
  spBindBar(el); spBindFind(el, "spf");
  if (ro) return;
  const upd = (id, f) => { const r = JSON.parse(JSON.stringify(DB.spsaad.find(x => x.id === id))); f(r); spQueuePut("spsaad", r); };
  $$("[data-sf]", el).forEach(i => i.onchange = () => { upd(i.dataset.sid, r => { let v = i.value; if (i.dataset.sf === "sched") { v = spNumIn(v); if (Number.isNaN(v)) v = null; } r[i.dataset.sf] = v; }); render(); });

  $("#saAdd", el).onclick = () => { const ord = Math.max(0, ...rows.map(r => num(r.ord))) + 1; spQueuePut("spsaad", { id: ymv + "|" + uid("sa"), ym: ymv, ord, name: "", saadName: "", sched: null, d: {} }); render(); };
} };
const spCovCls = s => !s ? "" : (s === "Full month covered" || s === "AHL covered") ? "sp-ok" : (/^(Short|Till)/.test(s) ? "sp-bad" : "");

/* ---------------- 2 In-house plan & 4 Vendor plan (blocks) ---------------- */
function spBlocks(el, pageId, kind) {
  const T = SP_TITLES[pageId]; if (!spReady()) return spEmpty(el, T);
  const R = spResult(SPV.ym), ymv = SPV.ym, ds = spDays(ymv), ro = !can("entry"), cfg = spCfg();
  const parts = spParts().filter(p => p.source === (kind === "v" ? "Vendor" : "In-house")).sort((a, b) => num(kind === "v" ? a.vord : a.iord) - num(kind === "v" ? b.vord : b.iord) || num(a.ord) - num(b.ord));
  const cells = (o, fmt, cls) => ds.map(x => { const v = o ? o[x.d] : undefined; const c = typeof cls === "function" ? cls(x.d, v) : ""; return `<td class="n ${x.sun ? "sun" : ""}${x.valid ? "" : " off"} ${c}">${x.valid && v !== undefined && v !== "" && v !== null ? fmt(v, x.d) : ""}</td>`; }).join("");
  const num0 = v => v ? spF(v) : (v === 0 ? "" : "");
  let blk = 0;
  const body = parts.map(p => {
    const P = R.part[p.id]; if (!P || !P.blk) return ""; const b = P.blk; blk++;
    const fk = `data-find="${spFindKey(P)}"`;
    const ahlCls = d => num(P.ahl[d]) > 0 ? (b.close[d] >= 0 ? "sp-gr" : "sp-rd") : "";
    const covFmt = v => v === "Short" ? "Short" : spDdMmm(ymv, v);
    const covCls = (d, v) => v === undefined ? "" : v === "Short" ? "sp-rd" : (v < d ? "sp-or" : "sp-gr2");
    const planRows = kind === "v" ? P.vrows.map((r, j) => `<tr class="sp-vp" ${fk}><td></td><td class="sp-stk1">${ro ? spP(r.share) : `<input class="sp-pin w4 n" data-vr="${p.id}|${j}" data-vf="share" value="${Math.round(num(r.share) * 1000) / 10}" title="share %">%`}</td><td></td><td class="sp-stk2 sp-name">${esc(p.name)}</td><td>${ro ? esc(r.vendor) : `<select class="sp-pin" data-vr="${p.id}|${j}" data-vf="vendor"><option></option>${cfg.vendors.filter(v => v.short).map(v => `<option${v.short === r.vendor ? " selected" : ""}>${esc(v.short)}</option>`).join("")}${r.vendor && !cfg.vendors.some(v => v.short === r.vendor) ? `<option selected>${esc(r.vendor)}</option>` : ""}</select>`}</td><td class="sp-lab">Vendor Plan${ro ? "" : ` <button class="icon-btn" data-vadd="${p.id}" title="Add a second vendor">＋</button>${P.vrows.length > 1 ? `<button class="icon-btn" data-vdel="${p.id}|${j}" title="Remove this vendor">✕</button>` : ""}`}</td>${cells(r.d, num0)}<td class="n b">${spF(r.total)}</td><td class="n">${spF(r.td)}</td><td class="n">${j === 0 ? spF(P.M) : ""}</td><td class="n ${j === 0 && b.overUnder < 0 ? "sp-rdt" : ""}">${j === 0 ? spF(b.overUnder) : ""}</td><td></td></tr>`).join("")
      : `<tr class="sp-pp" ${fk}><td></td><td class="sp-stk1"></td><td></td><td class="sp-stk2 sp-name">${esc(p.name)}</td><td class="muted" style="font-size:11px">from Saad's sheet 2a</td><td class="sp-lab">Production Plan</td>${cells(b.plan, num0)}<td class="n b">${spF(b.planTotal)}</td><td class="n">${spF(b.planTD)}</td><td class="n">${spF(P.M)}</td><td class="n ${b.overUnder < 0 ? "sp-rdt" : ""}">${spF(b.overUnder)}</td><td></td></tr>`;
    return `<tr class="sp-ahl sp-blk" ${fk}><td class="c b">${blk}</td><td class="sp-stk1 mono">${esc(p.erp)}</td><td class="mono">${esc(p.pcode)}</td><td class="sp-stk2 sp-name b" title="${esc(p.name)}">${esc(p.name)}</td><td>${esc(kind === "v" ? p.vendor : p.dept)}</td><td class="sp-lab">AHL Plan</td>${cells(P.ahl, num0, ahlCls)}<td class="n b">${spF(P.AL)}</td><td class="n">${spF(P.AM)}</td><td class="n">${spF(P.open)}</td><td></td><td class="${kind === "v" && P.check !== "OK" ? "sp-bad" : "sp-ok"}">${kind === "v" ? esc(P.check) : "OK"}</td></tr>
      <tr class="sp-net" ${fk}><td></td><td class="sp-stk1"></td><td></td><td class="sp-stk2"></td><td class="muted">Opening: ${spF(P.open)}</td><td class="sp-lab">Net Req. (after opening)</td>${cells(b.net, num0)}<td class="n">${spF(b.netTotal)}</td><td class="n">${spF(b.netTD)}</td><td></td><td></td><td></td></tr>
      ${planRows}
      <tr class="sp-cov" ${fk}><td></td><td class="sp-stk1"></td><td></td><td class="sp-stk2"></td><td></td><td class="sp-lab">Covers AHL till</td>${cells(b.covers, covFmt, covCls)}<td class="${spCovCls(b.cover)}">${esc(b.cover)}</td><td></td><td></td><td class="${spCovCls(b.covMsg)}">${esc(b.covMsg)}</td><td></td></tr>
      <tr class="sp-cl" ${fk}><td></td><td class="sp-stk1"></td><td></td><td class="sp-stk2"></td><td></td><td class="sp-lab">Closing Stock</td>${cells(b.close, v => spF(v), (d, v) => v < 0 ? "sp-rd" : "")}<td class="n b ${b.closeEnd < 0 ? "sp-rdt" : ""}">${spF(b.closeEnd)}</td><td></td><td></td><td></td><td></td></tr>`;
  }).join("");
  const totA = ds.map(x => parts.reduce((a, p) => a + num((R.part[p.id] || {}).ahl ? R.part[p.id].ahl[x.d] : 0), 0)), totP = ds.map(x => parts.reduce((a, p) => a + num(R.part[p.id] && R.part[p.id].blk ? R.part[p.id].blk.plan[x.d] : 0), 0));
  const lab = kind === "v" ? "Vendor Plan" : "Production Plan";
  el.innerHTML = spBar(T, kind === "v" ? "automatic lots from AHL plan, opening, MIN and each vendor's delivery days (4a), rounded to pack qty" : "blue = AHL plan · orange = Saad's production plan · Closing = stock left after dispatching AHL") +
    `<div class="tip">${kind === "v" ? "AHL cells <b style='color:#1E5E2B'>green</b> = covered on time, <b style='color:#9C0006'>red</b> = not. Purple Vendor Plan row is automatic: on each delivery day it orders enough to cover AHL until the next delivery + MIN − stock in hand. Yellow: vendor and share % (parts shared by two vendors)." : "AHL cells green = production covers them on time, red = not. Purple row = date each lot covers AHL till. Production plan comes from sheet 2a (don't type here)."}</div>
    <div class="panel"><div class="panel-head">${spFind("spf")}</div><div class="tw sp-tw"><table class="sp-x sp-blocks"><thead>${spDayHead(ymv, '<th></th><th class="sp-stk1"></th><th></th><th class="sp-stk2"></th><th></th><th></th>')}<th></th><th></th><th></th><th></th><th></th></tr>
    <tr><th>Blk</th><th class="sp-stk1">ERP Code</th><th>P Code</th><th class="sp-stk2">Part Name</th><th>${kind === "v" ? "Vendor" : "Department"}</th><th>Row</th>${spDateHead(ymv)}<th>Month Total (Closing row = month-end stock)</th><th>To Date (incl. look-ahead)</th><th>Opening Stock (blue) / Required Supply (plan row)</th><th>Plan − Required (+ over / − short)</th><th>Check</th></tr></thead>
    <tbody>${body}</tbody><tfoot><tr><td></td><td class="sp-stk1"></td><td></td><td class="sp-stk2 b">TOTAL — AHL Plan</td><td></td><td></td>${totA.map(v => `<td class="n">${v ? spF(v) : ""}</td>`).join("")}<td class="n b">${spF(totA.reduce((a, b) => a + b, 0))}</td><td></td><td></td><td></td><td></td></tr>
    <tr><td></td><td class="sp-stk1"></td><td></td><td class="sp-stk2 b">TOTAL — ${lab}</td><td></td><td></td>${totP.map(v => `<td class="n">${v ? spF(v) : ""}</td>`).join("")}<td class="n b">${spF(totP.reduce((a, b) => a + b, 0))}</td><td></td><td></td><td></td><td></td></tr></tfoot></table></div></div>`;
  spBindBar(el); spBindFind(el, "spf");
  if (ro || kind !== "v") return;
  const edit = (pid, f) => { const p = JSON.parse(JSON.stringify(spPart(pid))); p.vrows = p.vrows && p.vrows.length ? p.vrows : [{ vendor: p.vendor, share: 1 }]; f(p); spSavePart(p); render(); };
  $$("[data-vr]", el).forEach(i => i.onchange = () => { const [pid, j] = i.dataset.vr.split("|"); edit(pid, p => { if (i.dataset.vf === "share") p.vrows[+j].share = num(i.value) / 100; else p.vrows[+j].vendor = i.value; }); });
  $$("[data-vadd]", el).forEach(b => b.onclick = () => edit(b.dataset.vadd, p => { const n = p.vrows.length + 1; p.vrows.forEach(r => r.share = Math.round(1 / n * 100) / 100); p.vrows.push({ vendor: "", share: Math.round((1 - (n - 1) * Math.round(1 / n * 100) / 100) * 100) / 100 }); }));
  $$("[data-vdel]", el).forEach(b => b.onclick = () => { const [pid, j] = b.dataset.vdel.split("|"); edit(pid, p => { p.vrows.splice(+j, 1); if (p.vrows.length === 1) p.vrows[0].share = 1; }); });
}
PAGES.sp_ih = { render(el) { spBlocks(el, "sp_ih", "i"); } };
PAGES.sp_vp = { render(el) { spBlocks(el, "sp_vp", "v"); } };

const spStCls = s => ({ "OK": "sp-st-ok", "On track": "sp-st-ok", "Below MIN": "sp-st-or", "Behind": "sp-st-or", "Negative": "sp-st-rd", "At risk": "sp-st-rd", "Above MAX": "sp-st-yl" }[s] || "");
PAGES.sp_comp = { render(el) {
  const T = SP_TITLES.sp_comp; if (!spReady()) return spEmpty(el, T);
  const R = spResult(SPV.ym); const L = R.list.map(id => R.part[id]); const t = f => L.reduce((a, P) => a + num(f(P)), 0);
  const T_ = { I: t(P => P.open), J: t(P => P.J), K: t(P => P.K), L: t(P => P.L), M: t(P => P.M), N: t(P => P.N), O: t(P => P.Otd), P: t(P => P.Pr), R: t(P => P.Rd), T: t(P => P.T), U: t(P => P.U), V: t(P => P.V), X: t(P => P.X), Y: t(P => P.Y), AA: t(P => P.AA) };

    <tr class="sp-grp"><th colspan="6">PART</th><th colspan="3">STOCK LIMITS</th><th colspan="4">AHL REQUIREMENT</th><th colspan="4">SUPPLY (PRODUCTION / VENDOR)</th><th colspan="3">DISPATCH TO AHL</th><th colspan="6">STOCK &amp; OUTLOOK</th><th></th></tr>
    <tr><th>Sr#</th><th class="sp-stk1">ERP Code</th><th>P Code</th><th class="sp-stk2">Part Name</th><th>Source</th><th>Vendor / Dept</th><th>MIN</th><th>MAX</th><th>Opening Stock</th><th>AHL Plan Month</th><th>AHL Plan To Date</th><th>Net Requirement (AHL + MIN − Opening)</th><th>Required Supply (rounded to 100, + buffer)</th><th>Supply Plan Month</th><th>Supply Plan To Date</th><th>Received To Date</th><th>Supply Adherence %</th><th>Dispatched To Date</th><th>Dispatch % (vs plan to date)</th><th>Ahead (+) / Behind (−)</th><th>Stock In Hand</th><th>Balance to Dispatch (month)</th><th>Stock Status</th><th>Pending Supply</th><th>Projected Month-End Stock</th><th>Overall Status</th><th>Weight Dispatched (kg)</th></tr></thead><tbody>
    ${L.map(P => `<tr data-find="${spFindKey(P)}" data-z="${esc(P.Z)}">${spPartCols(P)}<td class="n">${spF(P.MIN)}</td><td class="n">${spF(P.MAX)}</td><td class="n">${spF(P.open)}</td><td class="n">${spF(P.J)}</td><td class="n">${spF(P.K)}</td><td class="n">${spF(P.L)}</td><td class="n b">${spF(P.M)}</td><td class="n">${spF(P.N)}</td><td class="n">${spF(P.Otd)}</td><td class="n">${spF(P.Pr)}</td><td class="n">${spP(P.Q)}</td><td class="n">${spF(P.Rd)}</td><td class="n">${spP(P.S)}</td><td class="n ${P.T < 0 ? "sp-rdt" : ""}">${spF(P.T)}</td><td class="n">${spF(P.U)}</td><td class="n">${spF(P.V)}</td><td class="${spStCls(P.W)}">${esc(P.W)}</td><td class="n">${spF(P.X)}</td><td class="n ${P.Y < 0 ? "sp-rdt" : ""}">${spF(P.Y)}</td><td class="${spStCls(P.Z)}">${esc(P.Z)}</td><td class="n">${spF(P.AA)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td></td><td class="sp-stk1"></td><td></td><td class="sp-stk2 b">TOTAL</td><td></td><td></td><td></td><td></td>${["I", "J", "K", "L", "M", "N", "O", "P"].map(k => `<td class="n">${spF(T_[k])}</td>`).join("")}<td class="n">${spP(T_.O ? T_.P / T_.O : null)}</td><td class="n">${spF(T_.R)}</td><td class="n">${spP(T_.K ? T_.R / T_.K : null)}</td><td class="n">${spF(T_.T)}</td><td class="n">${spF(T_.U)}</td><td class="n">${spF(T_.V)}</td><td></td><td class="n">${spF(T_.X)}</td><td class="n">${spF(T_.Y)}</td><td></td><td class="n">${spF(T_.AA)}</td></tr></tfoot></table></div></div>`;
  spBindBar(el); spBindFind(el, "spf");
  $("#cpZ", el).onchange = e => $$("tr[data-z]", el).forEach(r => r.style.display = !e.target.value || r.dataset.z === e.target.value ? "" : "none");
} };

/* ---------------- 4a Delivery calendar ---------------- */

  const q = k => ds.map(x => { const v = x.valid ? R.qc[x.d][k] : ""; const cls = k === "load" && x.valid && v != null ? (v > 1 ? "sp-rd" : v >= 0.4 ? "sp-gr2" : v > 0 ? "sp-yl" : "") : ""; return `<td class="n ${x.sun ? "sun" : ""}${x.valid ? "" : " off"} ${cls}">${x.valid ? (k === "load" ? spP(v) : spF(v)) : ""}</td>`; }).join("");
  const loadDays = ds.filter(x => x.valid);
  el.innerHTML = spBar(T, "choose each vendor's delivery weekdays · fewer days = bigger lots, fewer trips") + `<div class="panel"><div class="tw sp-tw"><table class="sp-x sp-cal"><thead>${spDayHead(ymv, '<th class="sp-stk2"></th><th></th><th></th><th></th><th></th><th></th>')}<th></th></tr>
    <tr><th class="sp-stk2">Vendor</th><th>Delivery day 1</th><th>Delivery day 2</th><th>Delivery day 3</th><th>Deliveries planned</th><th>Parts (plan rows)</th>${spDateHead(ymv)}<th>Month pcs</th></tr></thead><tbody>

    <tr class="sp-sec"><td class="sp-stk2" colspan="38">Planned pcs arriving per vendor (shaded = vendor delivery day)</td></tr>${g1}
    <tr class="sp-sec"><td class="sp-stk2" colspan="38">Inspection lots per vendor (number of part-lots arriving)</td></tr>${g2}
    <tr class="sp-sec"><td class="sp-stk2" colspan="38">Quality inspection load (from 4-Vendor Plan)</td></tr>
    <tr><td class="sp-stk2 b" colspan="6">Vendors arriving</td>${q("arriving")}<td></td></tr>
    <tr><td class="sp-stk2 b" colspan="6">Inspection lots (part-lots)</td>${q("lots")}<td class="n b">${spF(loadDays.reduce((a, x) => a + R.qc[x.d].lots, 0))}</td></tr>
    <tr><td class="sp-stk2 b" colspan="6">QC capacity (lots/day)</td>${q("cap")}<td></td></tr>

/* ======================= Vendor performance (quantity · quality · on-time delivery) ======================= */
function spPerfMonths(ymv, period) {
  let list = [ymv];
  if (period === "3m") list = [addMonths(ymv, -2), addMonths(ymv, -1), ymv];
  if (period === "fy") { const m = +ymv.slice(5), y = +ymv.slice(0, 4); const start = (m >= 7 ? y : y - 1) + "-07"; list = []; for (let x = start; x <= ymv; x = addMonths(x, 1)) list.push(x); }
  return list.filter(x => x === ymv || spHasMonth(x));
}
const spPerfLabel = (ymv, period) => { const ms = spPerfMonths(ymv, period); return ms.length > 1 ? ymLabel(ms[0]) + " – " + ymLabel(ms[ms.length - 1]) : ymLabel(ms[0]); };

/* one vendor, one month → part lines + delivery log */
function spPerfMonth(ymv, vendor, grace) {
  const R = spResult(ymv, true); const out = { parts: [], log: [] };
  R.list.forEach(id => {
    const P = R.part[id]; if (P.p.source !== "Vendor" || !P.vrows) return;
    const mine = P.vrows.filter(r => r.vendor === vendor); if (!mine.length) return;
    const nv = new Set(P.vrows.map(r => r.vendor)).size;
    const share = mine.reduce((a, r) => a + num(r.share), 0) || (nv === 1 ? 1 : 0);
    const own = (by, d) => num((by[vendor] || {})[d]) + (nv === 1 ? num((by["*"] || {})[d]) : share * num((by["*"] || {})[d]));
    let sch = 0, acc = 0, rej = 0, cumS = 0; const cumR = {}; let cr = 0;
    for (let d = 1; d <= R.N; d++) { cr += own(P.rcvBy, d); cumR[d] = cr; }
    const lim = R.D_rd;
    for (let d = 1; d <= lim; d++) { sch += mine.reduce((a, r) => a + num(r.d[d]), 0); acc += own(P.rcvBy, d); rej += own(P.rejBy, d); }
    let due = 0, onTime = 0, delaySum = 0, delayN = 0;
    for (let d = 1; d <= lim; d++) {
      const q = mine.reduce((a, r) => a + num(r.d[d]), 0); if (!(q > 0)) continue;
      cumS += q; due++;
      let e = null; for (let k = 1; k <= lim; k++) if (cumR[k] + 1e-9 >= cumS) { e = k; break; }
      const late = e == null ? lim - d : Math.max(0, e - d);
      const ok = e != null && e <= d + grace;
      if (ok) onTime++; else { delaySum += late; delayN++; }
      out.log.push({ ym: ymv, d, part: P.p.name, qty: q, cumS, got: e != null ? cumR[e] : cumR[lim] || 0, e, late, ok, open: e == null });
    }
    if (sch || acc || rej || due) out.parts.push({ ym: ymv, id, name: P.p.name, pcode: P.p.pcode, share, nv, sch, acc, rej, due, onTime, delaySum, delayN, month: mine.reduce((a, r) => a + num(r.total), 0) });
  });
  return out;
}
function spPerfScore(vendor, months) {
  const cfg = spCfg(), pf = Object.assign({ wQty: 40, wQual: 30, wOtd: 30, grace: 0 }, cfg.perf || {});
  const parts = [], log = [];
  months.forEach(m => { const o = spPerfMonth(m, vendor, num(pf.grace)); parts.push(...o.parts); log.push(...o.log); });
  const S = k => parts.reduce((a, p) => a + num(p[k]), 0);
  const sch = S("sch"), acc = S("acc"), rej = S("rej"), due = S("due"), onTime = S("onTime"), delaySum = S("delaySum"), delayN = S("delayN");
  const qty = sch > 0 ? Math.min(1, acc / sch) : null, qtyRaw = sch > 0 ? acc / sch : null;
  const qual = acc + rej > 0 ? acc / (acc + rej) : null, ppm = acc + rej > 0 ? rej / (acc + rej) * 1e6 : null;
  const otd = due > 0 ? onTime / due : null;
  const comps = [[qty, num(pf.wQty)], [qual, num(pf.wQual)], [otd, num(pf.wOtd)]].filter(c => c[0] != null && c[1] > 0);
  const wt = comps.reduce((a, c) => a + c[1], 0);
  const score = wt && (sch > 0 || due > 0) ? comps.reduce((a, c) => a + c[0] * c[1], 0) / wt * 100 : null;
  const grade = score == null ? "–" : score >= 90 ? "A" : score >= 75 ? "B" : score >= 60 ? "C" : "D";
  return { vendor, parts, log, sch, acc, rej, due, onTime, late: due - onTime, avgDelay: delayN ? delaySum / delayN : 0, qty, qtyRaw, qual, ppm, otd, score, grade, pf };
}

const spGradeCls = g => ({ A: "sp-st-ok", B: "sp-st-ok", C: "sp-st-or", D: "sp-st-rd" }[g] || "");

const MG = { ym: null };
const mgLight = (v, good, warn, lowerIsBetter) => v == null ? "na" : lowerIsBetter ? (v <= good ? "good" : v <= warn ? "warn" : "bad") : (v >= good ? "good" : v >= warn ? "warn" : "bad");
const mgWord = { good: "On track", warn: "Watch", bad: "Action needed", na: "No data" };
const mgPct = v => v == null ? "—" : nf(v * 100, 0) + "%";
const mgYL = x => ymLabel(x).replace(/ (\d\d)$/, " 20$1");
const mgBig = v => { const a = Math.abs(v); return a >= 1e7 ? nf(v / 1e7, 2) + " Cr" : a >= 1e5 ? nf(v / 1e5, 1) + " lakh" : nf(Math.round(v)); };

function mgData(ymv) {
  const D = { ymv };
  /* AHL supply */
  if (spReady() && spHasMonth(ymv)) {
    const R = spResult(ymv, true), k = R.summary.kpi; D.R = R; D.k = k;
    const L = R.list.map(id => R.part[id]);
    D.atRisk = L.filter(P => P.Z === "At risk").sort((a, b) => a.Y - b.Y);
    D.neg = L.filter(P => P.U < 0);
    D.src = R.summary.src;
    /* vendors */
    const vs = spCfg().vendors.filter(v => v.short);
    D.vend = vs.map(v => spPerfScore(v.short, [ymv])).filter(s => s.score != null).sort((a, b) => b.score - a.score);
    const due = D.vend.reduce((a, s) => a + s.due, 0), on = D.vend.reduce((a, s) => a + s.onTime, 0);
    D.otd = due ? on / due : null; D.lotsDue = due; D.lotsOn = on;
    const acc = D.vend.reduce((a, s) => a + s.acc, 0), rej = D.vend.reduce((a, s) => a + s.rej, 0);
    D.qual = acc + rej ? acc / (acc + rej) : null;
  }
  /* store inventory */
  const live = DB.items.filter(i => i.active !== false && i.type !== "service");
  D.items = DB.txns.length ? live.length : 0;
  if (D.items) {
    D.stockVal = live.reduce((a, i) => a + valueOf(i.id), 0);
    D.low = live.filter(i => num(i.min) > 0 && ["warn", "bad"].includes(stockStatus(i).k));
    D.issued = consumption({ months: [ymv] }).reduce((a, c) => a + c.v, 0);
    D.issuedPrev = consumption({ months: [addMonths(ymv, -1)] }).reduce((a, c) => a + c.v, 0);
    const lots = Object.values(ix().lots).filter(L => L.open > 0); D.stLots = lots.length; D.stOver = lots.filter(L => L.overdue).length;
  }
  /* people */
  if (typeof otGet === "function" && otGet(ymv)) { const c = otCalc(otGet(ymv)); if (c.T.wh) D.ot = c; }
  return D;
}

  (D.neg || []).filter(P => !D.atRisk.includes(P)).slice(0, 3).forEach(P => act.push({ t: "Negative stock", w: esc(P.p.name), d: `book stock ${nf(P.U)} pcs — check receiving entries`, go: "sp_ds", st: "warn" }));
  if (D.low && D.low.length) act.push({ t: "Reorder", w: `${D.low.length} store item${D.low.length > 1 ? "s" : ""}`, d: D.low.slice(0, 3).map(i => esc(i.name)).join(", ") + (D.low.length > 3 ? "…" : ""), go: "reorder", st: "warn" });
  if (D.stOver) act.push({ t: "Surface treatment", w: `${D.stOver} overdue lot${D.stOver > 1 ? "s" : ""}`, d: "follow up with the treatment vendor", go: "st", st: "warn" });

  const dot = st => `<i class="mg-dot ${st}"></i>`;
  const tr = D.R ? D.R.summary.trend : [];
  el.innerHTML = `<div class="print-head"><b>${esc(co)}</b> — Supply Chain Dashboard · ${mgYL(MG.ym)} · as of ${asOf}</div>
  <div class="mg-hero"><div><div class="mg-eyebrow">${esc(co)} · Supply Chain</div><h1>Dashboard</h1><div class="mg-asof">${ymLabel(MG.ym).replace(/ (\d\d)$/, " 20$1")} · position as of <b>${asOf}</b></div></div>
    <div class="mg-actions no-print"><select class="inp" id="mgYm">${months.map(x => `<option value="${x}"${x === MG.ym ? " selected" : ""}>${ymLabel(x).replace(/ (\d\d)$/, " 20$1")}</option>`).join("")}</select><button class="btn btn-brand" id="mgPrint">🖨 Print / PDF</button></div></div>
  ${tiles.length ? `<div class="mg-tiles">${tiles.map(t => `<button class="mg-tile ${t.st}" data-go="${t.go}"><div class="mg-tk">${dot(t.st)}${t.k}</div><div class="mg-tv">${t.v}</div><div class="mg-ts">${t.s}</div><div class="mg-tw">${mgWord[t.st]} →</div></button>`).join("")}</div>` : `<div class="panel"><div class="panel-body muted">No data for ${mgYL(MG.ym)} yet.</div></div>`}
  <div class="mg-grid">
    <section class="panel mg-msgs"><div class="panel-head"><h2>Key points this month</h2></div><ul>${msg.map(([st, t]) => `<li>${dot(st)}<span>${t}</span></li>`).join("") || `<li class="muted">Nothing to report yet.</li>`}</ul></section>
    <section class="panel"><div class="panel-head"><h2>Needs a decision or follow-up</h2><span class="sub">${act.length || "none"}</span></div>
      ${act.length ? `<table class="mg-act"><tbody>${act.map(a => `<tr data-go="${a.go}"${a.pv ? ` data-pv="${esc(a.pv)}"` : ""}><td>${dot(a.st)}</td><td class="mg-at">${a.t}</td><td><b>${a.w}</b><div class="muted">${a.d}</div></td><td class="mg-arr">›</td></tr>`).join("")}</tbody></table>` : `<div class="panel-body muted">Nothing needs attention right now. ✓</div>`}</section>
  </div>
  ${D.R ? `<div class="mg-grid">
    <section class="panel"><div class="panel-head"><h2>AHL plan vs dispatched</h2><span class="sub">cumulative pcs, ${mgYL(MG.ym)}</span></div><div class="panel-body">${lineChart(tr.map(t => String(t.d)), [{ name: "Planned by AHL", color: "var(--s1)", values: tr.map(t => t.cp), dots: false }, { name: "Dispatched", color: "var(--brand)", values: tr.map(t => t.d <= D.R.D_rd ? t.cd : null), dots: false }], v => mgBig(v), 230)}</div></section>
    <section class="panel"><div class="panel-head"><h2>Vendor scorecard</h2><span class="sub">quantity · quality · on-time, ${mgYL(MG.ym)}</span><div class="right"><button class="btn btn-sm" data-go="sp_perf">Reports →</button></div></div>
      ${D.vend.length ? `<table class="mg-vs"><thead><tr><th>Vendor</th><th>Score</th><th>Qty</th><th>On-time</th><th>Grade</th></tr></thead><tbody>${D.vend.map(s => `<tr data-go="sp_perf" data-pv="${esc(s.vendor)}"><td class="b">${esc(s.vendor)}</td><td><div class="mg-bar"><span style="width:${Math.max(2, s.score)}%" class="${s.grade === "A" || s.grade === "B" ? "good" : s.grade === "C" ? "warn" : "bad"}"></span><em>${nf(s.score, 0)}</em></div></td><td class="n">${mgPct(s.qty)}</td><td class="n">${mgPct(s.otd)}</td><td class="c"><span class="mg-grade g${s.grade}">${s.grade}</span></td></tr>`).join("")}</tbody></table>` : `<div class="panel-body muted">No vendor deliveries due yet.</div>`}</section>
  </div>
  <div class="mg-grid mg-g3">
    ${D.src.map(r => `<section class="panel mg-mini" data-go="${r.label === "Vendor" ? "sp_vp" : "sp_ih"}"><div class="panel-head"><h2>${r.label === "Vendor" ? "Vendor supply" : "In-house supply"}</h2><span class="sub">${r.parts} parts</span></div><div class="panel-body">
      <div class="mg-row"><span>Supplied vs plan to date</span><b class="${mgLight(r.adh, 0.95, 0.85)}">${mgPct(r.adh)}</b></div><div class="mg-meter"><span style="width:${Math.min(100, (r.adh || 0) * 100)}%"></span></div>
      <div class="mg-row"><span>Dispatched to AHL vs plan</span><b class="${mgLight(r.dsp, 0.95, 0.85)}">${mgPct(r.dsp)}</b></div><div class="mg-meter"><span style="width:${Math.min(100, (r.dsp || 0) * 100)}%"></span></div>
      <div class="mg-row muted"><span>Received ${nf(r.Pr)} · dispatched ${nf(r.Rd)}</span><span>in hand ${nf(r.U)}</span></div></div></section>`).join("")}
    <section class="panel mg-mini" data-go="sp_ds"><div class="panel-head"><h2>Stock health — AHL parts</h2></div><div class="panel-body">${hbars(D.R.summary.stock.filter(s => s.n).map(s => ({ name: s.s, v: s.n, color: { "Negative": "var(--s8)", "Below MIN": "var(--s2)", "OK": "var(--s6)", "Above MAX": "var(--s4)", "MIN not set": "var(--sOther)" }[s.s] })), v => nf(v) + " parts")}</div></section>
  </div>` : ""}
  ${D.items || D.ot ? `<div class="mg-grid">
    ${D.items ? `<section class="panel mg-mini" data-go="overview"><div class="panel-head"><h2>Store &amp; consumables</h2></div><div class="panel-body mg-figs">
      <div><span>Stock value</span><b>Rs ${mgBig(D.stockVal)}</b></div><div><span>Issued in ${mgYL(MG.ym)}</span><b>Rs ${mgBig(D.issued)}</b></div><div><span>Below minimum</span><b class="${mgLight(D.low.length, 0, 5, true)}">${D.low.length}</b></div><div><span>At surface treatment</span><b>${D.stLots}${D.stOver ? ` <small class="bad">(${D.stOver} late)</small>` : ""}</b></div></div></section>` : ""}
    ${D.ot ? `<section class="panel mg-mini" data-go="ot"><div class="panel-head"><h2>People — overtime &amp; absence</h2><span class="sub">SCM sections</span></div><table class="mg-vs"><thead><tr><th>Section</th><th>Strength</th><th>OT hrs</th><th>OT %</th><th>Absence %</th></tr></thead><tbody>${D.ot.rows.map(r => `<tr><td class="b">${esc(r.s)}</td><td class="n">${r.str}</td><td class="n">${oh(r.tot)}</td><td class="n">${opct(r.otp)}</td><td class="n">${opct(r.lossp)}</td></tr>`).join("")}<tr class="b"><td>Total</td><td class="n">${D.ot.T.str}</td><td class="n">${oh(D.ot.T.tot)}</td><td class="n">${opct(D.ot.T.otp)}</td><td class="n">${opct(D.ot.T.lossp)}</td></tr></tbody></table></section>` : ""}
  </div>` : ""}
  <div class="mg-foot">Green = on track · Amber = watch · Red = action needed. Click any box to open the detailed sheet. Targets: dispatch & supply ≥ 95%, vendor on-time ≥ 90%, no parts at risk, no store items below minimum.</div>`;

  $("#mgYm", el).onchange = e => { MG.ym = e.target.value; if (spReady()) SPV.ym = MG.ym; render(); };
  $("#mgPrint", el).onclick = () => window.print();
  $$("[data-go]", el).forEach(x => x.addEventListener("click", ev => { ev.stopPropagation(); if (x.dataset.pv) SPV.perfVendor = x.dataset.pv; if (spReady()) SPV.ym = MG.ym; goTo(x.dataset.go); }));
} };
NAV.unshift({ g: "mgmt", ico: "⭐", l: "Dashboard", page: "mgmt" });

</script>
</body>
</html>
