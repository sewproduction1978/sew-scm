<style>
:root{
  color-scheme:light;
  --bg:#f3f5f3; --panel:#ffffff; --panel-2:#f6f8f6; --border:#e2e7e3; --text:#17201a; --muted:#5e6a62; --faint:#8b968e;
  --brand:#178a3e; --brand-2:#0f6d30; --brand-soft:#e7f5ec; --brand-line:#b9e0c6;
  --red:#d33a32; --red-soft:#fdecea; --amber:#b9770e; --amber-soft:#fff4dc; --blue:#2a78d6; --blue-soft:#e8f1fc;

  --r:12px;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111513; --panel:#1a1f1c; --panel-2:#212824; --border:#2d3631; --text:#edf1ee; --muted:#a3ada6; --faint:#76817a;
  --brand:#3dbb68; --brand-2:#5fd086; --brand-soft:#1d3326; --brand-line:#2f5a3d;
  --red:#ef6b63; --red-soft:#3a1f1d; --amber:#e3a63a; --amber-soft:#3a2f17; --blue:#5b9cec; --blue-soft:#1c2a3d;

}
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg); color:var(--text); font:14px/1.45 'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit; color:inherit;}
h1,h2,h3{margin:0; font-family:'Oswald','Inter',sans-serif; font-weight:600; letter-spacing:.02em;}
a{color:var(--brand);}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
.muted{color:var(--muted);} .faint{color:var(--faint);}
.hide{display:none !important;}

.brand-img{width:46px; height:40px; flex-shrink:0;}
.splash{position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:var(--bg); transition:opacity .7s ease, visibility .7s ease;}
.splash.gone{opacity:0; visibility:hidden; pointer-events:none;}
.splash-glow{position:absolute; width:430px; height:430px; max-width:90vw; max-height:90vw; border-radius:50%; background:radial-gradient(circle, var(--brand-soft), transparent 70%); filter:blur(46px); animation:glow 3.2s ease-in-out infinite;}
@keyframes glow{0%,100%{transform:scale(1); opacity:.6;} 50%{transform:scale(1.16); opacity:1;}}
.splash-inner{position:relative; display:flex; flex-direction:column; align-items:center;}
.splash-logo{width:150px; height:130px; opacity:0; transform:scale(.74) translateY(14px); animation:logoIn 1s cubic-bezier(.16,1,.3,1) forwards;}
@keyframes logoIn{to{opacity:1; transform:scale(1) translateY(0);}}
.splash-title{font:700 42px 'Oswald',sans-serif; letter-spacing:.11em; margin-top:16px; opacity:0; animation:fadeUp .8s ease forwards; animation-delay:.5s;}
.splash-sub{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-top:5px; opacity:0; animation:fadeUp .8s ease forwards; animation-delay:.75s;}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.splash-loader{width:220px; height:3px; background:var(--panel-2); border-radius:2px; margin-top:30px; overflow:hidden; opacity:0; animation:fadeUp .6s ease forwards; animation-delay:1s;}
.splash-loader-fill{height:100%; width:0%; background:linear-gradient(90deg, var(--brand-2), var(--brand)); animation:load 1.5s cubic-bezier(.4,0,.2,1) forwards; animation-delay:1.05s;}
@keyframes load{to{width:100%;}}
.splash-tag{font-size:10px; letter-spacing:.09em; color:var(--muted); margin-top:14px; opacity:0; animation:fadeUp .6s ease forwards; animation-delay:2.1s;}

/* ---------- top bar ---------- */
.top{position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:12px; padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--border);}
.menu-btn{width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--panel-2); cursor:pointer; display:grid; place-items:center; font-size:18px;}
.brand{display:flex; align-items:center; gap:10px; min-width:0;}
.brand-logo{width:34px; height:34px; border-radius:9px; background:var(--brand); color:#fff; display:grid; place-items:center; font:700 13px 'Oswald',sans-serif; letter-spacing:.05em;}
.brand b{white-space:nowrap; font:600 18px 'Oswald',sans-serif; letter-spacing:.04em;}
.brand span{display:block; font-size:11px; color:var(--muted); margin-top:-2px;}
.top-right{margin-left:auto; display:flex; align-items:center; gap:8px;}
.chip{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:600; background:var(--panel-2); border:1px solid var(--border); color:var(--muted); white-space:nowrap;}
.chip.live{color:var(--brand); border-color:var(--brand-line); background:var(--brand-soft);}
.chip.demo{color:var(--amber); background:var(--amber-soft); border-color:transparent;}
.user-btn{border:1px solid var(--border); background:var(--panel-2); border-radius:999px; padding:5px 12px 5px 5px; display:flex; align-items:center; gap:8px; cursor:pointer;}
.user-btn i{width:28px; height:28px; border-radius:50%; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; font-style:normal; font-weight:700; font-size:12px;}
.user-btn small{display:block; font-size:10.5px; color:var(--muted); line-height:1;}
.user-btn b{font-size:12.5px; line-height:1.2;}

/* ---------- nav drawer ---------- */
.nav{position:fixed; left:0; top:0; bottom:0; width:262px; background:var(--panel); border-right:1px solid var(--border); z-index:80; padding:14px 12px; display:flex; flex-direction:column; gap:3px; transform:translateX(-104%); transition:transform .28s cubic-bezier(.16,1,.3,1); overflow-y:auto; box-shadow:var(--shadow);}
.nav.open{transform:none;}
.nav-bd{position:fixed; inset:0; background:rgba(10,16,13,.45); z-index:70; opacity:0; visibility:hidden; transition:opacity .25s;}
.nav-bd.show{opacity:1; visibility:visible;}
.nav-title{font:600 13px 'Oswald',sans-serif; letter-spacing:.12em; color:var(--brand); padding:4px 10px 10px; text-transform:uppercase;}
.ng-head{display:flex; align-items:center; gap:10px; width:100%; border:0; background:transparent; border-radius:10px; padding:9px 10px; cursor:pointer; font-weight:600; font-size:13px; text-align:left;}
.ng-head:hover,.ng.open>.ng-head{background:var(--panel-2);}
.ng-ico{width:26px; height:26px; border-radius:7px; background:var(--panel-2); display:grid; place-items:center; font-size:14px;}
.ng.has-active .ng-ico{background:var(--brand-soft);}
.ng-head .lbl{flex:1;}
.ng-head .chev{font-size:10px; color:var(--muted); transition:transform .2s;}
.ng.open .chev{transform:rotate(90deg);}
.ng-head .dot{width:8px; height:8px; border-radius:50%; background:var(--red); display:none;}
.ng.alert:not(.open) .dot{display:block;}
.ng-body{display:none; margin-left:22px; padding:2px 0 6px 10px; border-left:2px solid var(--border);}
.ng.open>.ng-body{display:block;}
.nb{display:flex; align-items:center; gap:8px; width:100%; border:1px solid transparent; background:transparent; color:var(--muted); border-radius:8px; padding:7px 10px; cursor:pointer; font-size:12.8px; text-align:left;}
.nb:hover{background:var(--panel-2); color:var(--text);}
.nb.active{background:var(--brand-soft); color:var(--brand); border-color:var(--brand-line); font-weight:600;}
.nb .badge{margin-left:auto;}
.nav-single{margin-bottom:2px;}
.nav-foot{margin-top:auto; padding-top:10px; border-top:1px solid var(--border); display:flex; gap:6px;}
.nav-foot button{flex:1;}

/* ---------- layout ---------- */
.wrap{max-width:1380px; margin:0 auto; padding:18px 18px 90px;}
.page{display:none;} .page.active{display:block; animation:pgIn .2s ease;}
@keyframes pgIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
.page-head{display:flex; align-items:center; gap:12px; margin:4px 0 16px; flex-wrap:wrap;}
.page-head h1{font-size:22px; text-transform:uppercase; border-left:4px solid var(--brand); padding-left:10px; line-height:1.1;}
.page-head .sub{color:var(--muted); font-size:12.5px;}
.page-head .actions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); margin-bottom:16px; min-width:0;}
.panel-head{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.panel-head h2{font-size:14.5px; text-transform:uppercase; letter-spacing:.05em;}
.panel-head .sub{color:var(--muted); font-size:12px;}
.panel-head .right{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.panel-body{padding:14px 16px;}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px;}
.grid2>.panel,.grid3>.panel{margin-bottom:0;}
.stack{display:flex; flex-direction:column; gap:16px; margin-bottom:16px;}

/* ---------- KPI tiles ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:16px;}
.kpi{background:var(--panel); border:1px solid var(--border); border-radius:var(--r); padding:14px 16px; box-shadow:var(--shadow); cursor:default; position:relative; overflow:hidden;}
.kpi[data-go]{cursor:pointer;} .kpi[data-go]:hover{border-color:var(--brand-line);}
.kpi .k{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600;}
.kpi .v{font:600 26px/1.15 'Oswald',sans-serif; margin-top:4px; font-variant-numeric:tabular-nums;}
.kpi .s{font-size:12px; color:var(--muted); margin-top:2px;}
.kpi.warn .v{color:var(--amber);} .kpi.bad .v{color:var(--red);} .kpi.good .v{color:var(--brand);}
.delta{font-weight:600;} .delta.up{color:var(--red);} .delta.down{color:var(--brand);}

/* ---------- forms ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--border); background:var(--panel-2); border-radius:9px; padding:8px 14px; cursor:pointer; font-weight:600; font-size:13px; white-space:nowrap;}
.btn:hover{border-color:var(--brand-line);}
.btn-brand{background:var(--brand); border-color:var(--brand); color:#fff;} .btn-brand:hover{background:var(--brand-2);}
[data-theme="dark"] .btn-brand{color:#0b1a10;}
.btn-danger{color:var(--red);} .btn-sm{padding:5px 10px; font-size:12px; border-radius:8px;}
.btn-ghost{background:transparent;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.icon-btn{border:0; background:transparent; cursor:pointer; padding:4px 6px; border-radius:6px; color:var(--muted); font-size:14px;}
.icon-btn:hover{background:var(--panel-2); color:var(--text);}
.field{display:flex; flex-direction:column; gap:4px; min-width:0;}
.field label{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
.inp,select.inp,textarea.inp{width:100%; border:1px solid var(--border); background:var(--panel-2); border-radius:9px; padding:8px 10px; outline:none; min-height:38px;}
.inp:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); background:var(--panel);}
.inp.bad{border-color:var(--red); box-shadow:0 0 0 3px var(--red-soft);}
select.inp{cursor:pointer;}
select option,select optgroup{background:#fff !important; color:#17201a !important;}
[data-theme="dark"] select option,[data-theme="dark"] select optgroup{background:#1e2420 !important; color:#edf1ee !important;}
.form-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px;}
.form-grid .wide{grid-column:span 2;}
.filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.filters .inp{width:auto; min-width:140px;}
.filters .search{min-width:220px; flex:1;}
.seg{display:inline-flex; background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px; flex-wrap:wrap;}
.seg button{border:0; background:transparent; padding:6px 12px; border-radius:7px; cursor:pointer; font-weight:600; font-size:12.5px; color:var(--muted);}
.seg button.on{background:var(--panel); color:var(--brand); box-shadow:0 1px 3px rgba(0,0,0,.1);}
.chk{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer;}

/* ---------- tables ---------- */
.tw{overflow:auto; max-width:100%;}
.tw.tall{max-height:560px;}
table.t{width:100%; border-collapse:collapse; font-size:13px;}
.t th{position:sticky; top:0; background:var(--panel-2); z-index:1; text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
.t th.sortable{cursor:pointer;} .t th.sortable:hover{color:var(--text);}
.t td{padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
.t tbody tr:hover td{background:var(--panel-2);}
.t tr.click{cursor:pointer;}
.t tfoot td{font-weight:700; background:var(--panel-2); border-top:2px solid var(--border);}
.t .inp{min-height:32px; padding:5px 8px;}
.t td.act{white-space:nowrap; text-align:right; width:1%;}
.empty{padding:28px 16px; text-align:center; color:var(--muted);}
.badge{display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; background:var(--panel-2); color:var(--muted); border:1px solid var(--border);}
.badge.ok{background:var(--brand-soft); color:var(--brand); border-color:transparent;}
.badge.warn{background:var(--amber-soft); color:var(--amber); border-color:transparent;}
.badge.bad{background:var(--red-soft); color:var(--red); border-color:transparent;}
.badge.info{background:var(--blue-soft); color:var(--blue); border-color:transparent;}
.tag{display:inline-block; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:5px; background:var(--panel-2); color:var(--muted); margin-left:4px; vertical-align:1px;}
.note{font-size:12.5px; color:var(--muted);}
.tip{font-size:12.5px; color:var(--muted); background:var(--panel-2); border-radius:9px; padding:8px 12px; margin-bottom:12px;}

/* ---------- entry sheet ---------- */
.sheet td{padding:5px 6px;}
.sheet .ac{min-width:260px;}
.sheet .q{width:110px;} .sheet .r{width:110px;}
.sheet .stock{font-size:11.5px; color:var(--muted); white-space:nowrap;}
.sheet-foot{display:flex; align-items:center; gap:10px; padding:12px 16px; border-top:1px solid var(--border); flex-wrap:wrap;}
.sheet-foot .total{margin-left:auto; font-weight:700;}

/* ---------- autocomplete ---------- */
.ac-list{position:fixed; z-index:200; background:var(--panel); border:1px solid var(--brand-line); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,.25); max-height:300px; overflow:auto; min-width:280px;}
.ac-item{padding:7px 11px; cursor:pointer; font-size:13px; display:flex; gap:8px; align-items:baseline;}
.ac-item small{color:var(--muted); margin-left:auto; white-space:nowrap; font-size:11px;}
.ac-item.on,.ac-item:hover{background:var(--brand-soft);}
.ac-item .tp{font-size:10px; font-weight:700; color:var(--muted); background:var(--panel-2); border-radius:4px; padding:0 5px;}
.ac-new{color:var(--brand); font-weight:600;}

/* ---------- charts ---------- */
.chart{width:100%; position:relative;}
.chart svg{display:block; width:100%; height:auto; overflow:visible;}
.chart .gl{stroke:var(--border); stroke-width:1;}
.chart .ax{fill:var(--muted); font-size:11px;}
.chart .lbl{fill:var(--text); font-size:11px; font-weight:600;}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--muted); margin-bottom:8px;}
.legend span{display:inline-flex; align-items:center; gap:6px;}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block;}
.vtip{position:fixed; z-index:300; pointer-events:none; background:var(--panel); border:1px solid var(--border); box-shadow:0 8px 24px rgba(0,0,0,.2); border-radius:9px; padding:8px 10px; font-size:12px; min-width:140px; display:none;}
.vtip b{display:block; margin-bottom:4px;}
.vtip .r{display:flex; gap:10px; justify-content:space-between;}
.vtip i{width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:5px;}
.bar-row{display:grid; grid-template-columns:minmax(120px,38%) 1fr auto; gap:10px; align-items:center; padding:5px 0; font-size:12.5px;}
.bar-row .bn{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bar-row .bt{height:12px; background:var(--panel-2); border-radius:4px; overflow:hidden;}
.bar-row .bf{display:block; height:100%; border-radius:0 4px 4px 0; background:var(--s1);}
.bar-row .bv{font-variant-numeric:tabular-nums; font-weight:600; min-width:80px; text-align:right;}

/* ---------- modal & toast ---------- */
.modal-bd{position:fixed; inset:0; background:rgba(10,16,13,.5); z-index:150; display:none; align-items:flex-start; justify-content:center; padding:5vh 14px; overflow:auto;}
.modal-bd.show{display:flex;}
.modal{background:var(--panel); border-radius:14px; width:min(760px,100%); box-shadow:0 20px 60px rgba(0,0,0,.35); border:1px solid var(--border);}
.modal.wide{width:min(1100px,100%);}
.modal-head{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border);}
.modal-head h2{font-size:16px; text-transform:uppercase;}
.modal-head .x{margin-left:auto;}
.modal-body{padding:16px 18px;}
.modal-foot{display:flex; gap:8px; justify-content:flex-end; padding:12px 18px; border-top:1px solid var(--border);}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:#17201a; color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; z-index:400; opacity:0; transition:.25s; pointer-events:none; max-width:92vw;}
.toast.show{opacity:1; transform:translateX(-50%);}
.toast.err{background:var(--red);}

/* ---------- login ---------- */
.login{position:fixed; inset:0; z-index:500; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:16px;}
.login-card{background:var(--panel); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); width:min(400px,100%); padding:26px;}
.login-card h1{font-size:24px; margin:10px 0 2px;}
.login-card .form-grid{grid-template-columns:1fr; margin-top:18px;}
.login-err{color:var(--red); font-size:12.5px; min-height:18px; margin-top:8px;}

/* ---------- item card ---------- */
.ic-head{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start;}
.ic-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:12px 0;}
.ic-stats div{background:var(--panel-2); border-radius:10px; padding:9px 12px;}
.ic-stats span{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600;}
.ic-stats b{font:600 18px 'Oswald',sans-serif;}

/* ---------- responsive ---------- */
@media (max-width:980px){ .grid2,.grid3{grid-template-columns:1fr;} }
@media (max-width:640px){
  .wrap{padding:12px 12px 90px;}
  .top{padding:8px 12px;}
  .brand span,.user-btn .who{display:none;}
  .page-head h1{font-size:19px;}
  .form-grid{grid-template-columns:1fr 1fr;} .form-grid .wide{grid-column:span 2;}
  .filters .inp,.filters .search{min-width:0; flex:1 1 45%;}
  .kpi .v{font-size:22px;}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
  .kpi{padding:11px 12px;}
  .bar-row{grid-template-columns:minmax(90px,40%) 1fr auto;}
}

/* entry sheets become cards on phones */
@media (max-width:640px){
  table[data-sheet] thead{display:none;}
  table[data-sheet], table[data-sheet] tbody{display:block;}
  table[data-sheet] tr{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; padding:10px 12px; border-bottom:1px solid var(--border); position:relative;}
  table[data-sheet] td{border:0 !important; padding:0 !important; width:auto !important; min-width:0 !important;}
  table[data-sheet] td:first-child{display:none;}
  table[data-sheet] td.ac{grid-column:1/-1; padding-right:30px !important;}
  table[data-sheet] td.stock{grid-column:1/-1;}
  table[data-sheet] td.stock:empty{display:none;}
  table[data-sheet] td[data-val]{align-self:center;}
  table[data-sheet] td.act{position:absolute; top:12px; right:6px;}
  table[data-sheet] tbody tr:hover td{background:transparent;}
  .chip.demo{max-width:120px; overflow:hidden; text-overflow:ellipsis;}
}
.recent{list-style:none; margin:0; padding:0;}
.recent li{display:grid; grid-template-columns:52px 1fr auto; gap:10px; padding:9px 16px; border-bottom:1px solid var(--border); align-items:center; font-size:13px;}
.recent li:last-child{border-bottom:0;}
.recent .d{font-size:11.5px; color:var(--muted); line-height:1.2;}
.recent .n{min-width:0;} .recent .n b{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600;}
.recent .n small{color:var(--muted); font-size:11.5px;}
.recent .q{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
.recent .q small{display:block; color:var(--muted); font-size:11.5px;}

/* ---------- print ---------- */
@media print{
  @page{size:A4 landscape; margin:10mm;}
  :root,[data-theme="dark"]{color-scheme:light;
  --bg:#f3f5f3; --panel:#ffffff; --panel-2:#f6f8f6; --border:#e2e7e3; --text:#17201a; --muted:#5e6a62; --faint:#8b968e;
  --brand:#178a3e; --brand-2:#0f6d30; --brand-soft:#e7f5ec; --brand-line:#b9e0c6;
  --red:#d33a32; --red-soft:#fdecea; --amber:#b9770e; --amber-soft:#fff4dc; --blue:#2a78d6; --blue-soft:#e8f1fc;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --sOther:#9aa39c;
  --shadow:0 1px 2px rgba(16,24,20,.05),0 4px 14px rgba(16,24,20,.05);
  --r:12px;
    --bg:#fff; --panel:#fff; --panel-2:#f4f4f4; --text:#000; --muted:#444; --border:#ccc; --shadow:none;}
  .top,.nav,.nav-bd,.page-head .actions,.panel-head .right,.no-print,.toast,.btn,.icon-btn,.filters{display:none !important;}
  .page:not(.active){display:none !important;}
  .panel{box-shadow:none; break-inside:avoid;}
  .tw,.tw.tall{max-height:none; overflow:visible;}
  .print-head{display:block !important;}
  body{background:#fff;}
}
.print-head{display:none; font-size:12px; margin-bottom:10px;}

const pct = (v, d = 1) => isFinite(v) ? (v > 0 ? "+" : "") + nf(v * 100, d) + "%" : "—";

const dLabel = d => { if (!d) return ""; const [y, m, dd] = d.split("-"); return +dd + " " + MON[+m - 1] + " " + y; };
const addMonths = (k, n) => { let [y, m] = k.split("-").map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + "-" + String(m).padStart(2, "0"); };
const monthsBack = (n, end = ym(today())) => { const a = []; for (let i = n - 1; i >= 0; i--) a.push(addMonths(end, -i)); return a; };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);

function demoSave() { if (S.mode === "demo") lsSet("scm-demo-db", JSON.stringify({ items: DB.items, suppliers: DB.suppliers, prices: DB.prices, txns: DB.txns, settings: DB.settings })); }
function demoLoad() {

  return false;
}
function applyRecord(coll, id, data, deleted) {
  if (coll === "settings") { if (!deleted && data) DB.settings = Object.assign({}, DEFAULT_SETTINGS, data); return; }
  if (!DB[coll]) return;
  const arr = DB[coll], i = arr.findIndex(x => x.id === id);
  if (deleted) { if (i >= 0) arr.splice(i, 1); return; }
  if (i >= 0) arr[i] = data; else arr.push(data);
}
async function put(coll, objs) {
  objs = Array.isArray(objs) ? objs : [objs];
  if (!objs.length) return true;
  const now = new Date().toISOString();
  objs.forEach(o => { if (!o.id) o.id = uid(coll[0]); if (!o.createdAt) { o.createdAt = now; o.createdBy = S.name; } o.updatedAt = now; o.updatedBy = S.name; applyRecord(coll, o.id, o, false); });
  bump();
  if (S.mode === "demo") { demoSave(); return true; }
  for (let i = 0; i < objs.length; i += 400) {
    const rows = objs.slice(i, i + 400).map(o => ({ coll, id: o.id, data: o, deleted: false }));
    const { error } = await S.sb.from("scm_records").upsert(rows, { onConflict: "coll,id" });
    if (error) { toast("Not saved: " + error.message, true); await loadAll(); return false; }
  }
  return true;
}
async function del(coll, ids) {
  ids = Array.isArray(ids) ? ids : [ids];
  const olds = ids.map(id => (DB[coll] || []).find(x => x.id === id)).filter(Boolean);
  ids.forEach(id => applyRecord(coll, id, null, true)); bump();
  if (S.mode === "demo") { demoSave(); return true; }
  const rows = olds.map(o => ({ coll, id: o.id, data: Object.assign({}, o, { deletedBy: S.name, deletedAt: new Date().toISOString() }), deleted: true }));
  const { error } = await S.sb.from("scm_records").upsert(rows, { onConflict: "coll,id" });
  if (error) { toast("Not deleted: " + error.message, true); await loadAll(); return false; }
  return true;
}
async function saveSettings() {
  bump();
  if (S.mode === "demo") { demoSave(); return true; }
  const { error } = await S.sb.from("scm_records").upsert([{ coll: "settings", id: "main", data: DB.settings, deleted: false }], { onConflict: "coll,id" });
  if (error) { toast("Not saved: " + error.message, true); return false; }
  return true;
}
async function loadAll() {
  const fresh = { items: [], suppliers: [], prices: [], txns: [] }; let settings = null;
  for (let from = 0; ; from += 1000) {
    const { data, error } = await S.sb.from("scm_records").select("coll,id,data").eq("deleted", false).order("coll").order("id").range(from, from + 999);
    if (error) throw error;
    (data || []).forEach(r => { if (r.coll === "settings") settings = r.data; else if (fresh[r.coll]) fresh[r.coll].push(r.data); });
    if (!data || data.length < 1000) break;
  }
  COLLS.forEach(c => DB[c] = fresh[c]);
  DB.settings = Object.assign({}, DEFAULT_SETTINGS, settings || {});
  bump();

  DB.items.filter(i => i.type === "service").forEach(i => X.svcByProc[i.name.toLowerCase()] = i);
  DB.prices.forEach(p => (X.prices[p.itemId] = X.prices[p.itemId] || []).push(p));

function parseCSV(t) { const out = []; let row = [], f = "", q = false; t = t.replace(/^﻿/, ""); for (let i = 0; i < t.length; i++) { const c = t[i]; if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; } else if (c === '"') q = true; else if (c === ",") { row.push(f); f = ""; } else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(f); out.push(row); row = []; f = ""; } else f += c; } if (f || row.length) { row.push(f); out.push(row); } return out; }

    ${S.mode === "demo" && !SCM_CONFIG.url ? `<div class="tip" style="margin-top:14px"><b>Connect to Supabase</b> — paste the Project URL and the publishable key (Project Settings → API). Never paste the secret key.<div class="form-grid" style="margin-top:8px"><div class="field wide"><label>Project URL</label><input class="inp" id="cfgU" placeholder="https://xxxx.supabase.co"></div><div class="field wide"><label>Publishable key</label><input class="inp" id="cfgK" placeholder="sb_publishable_…"></div></div><button class="btn btn-sm" id="cfgSave" style="margin-top:8px">Connect this browser</button></div>` : ""}</div></div>`;
  if (ed) {
    $$("[data-rm]", el).forEach(b => b.onclick = async () => { const [k, i] = b.dataset.rm.split(":"); const v = st[k][+i]; if (k === "depts" && DB.txns.some(t => t.dept === v) && !confirmBox(`${v} has entries. Remove it from the list anyway? (old entries stay)`)) return; st[k].splice(+i, 1); await saveSettings(); render(); });
    $$("[data-add]", el).forEach(inp => inp.onkeydown = async e => { if (e.key !== "Enter") return; const v = inp.value.trim(); const k = inp.dataset.add; if (!v || st[k].includes(v)) return; st[k].push(v); if (k === "processes" && !DB.items.some(i => i.type === "service" && i.name.toLowerCase() === v.toLowerCase())) await put("items", { id: uid("sv"), type: "service", name: v, uom: "KG", category: "Surface Treatment", active: true }); await saveSettings(); render(); setTimeout(() => { const n = $(`[data-add="${k}"]`); n && n.focus(); }, 0); });
    $("#cmSave", el).onclick = async () => { const c = $("#cmC").value.trim(); if (!c) return; st.customers[c] = $("#cmM").value.split(",").map(x => x.trim()).filter(Boolean); await saveSettings(); render(); };
    $("#sSave", el).onclick = async () => { Object.assign(st, { company: $("#sCo").value.trim() || st.company, stDays: num($("#sSt").value) || 7, coverMonths: num($("#sCov").value) || 1, slowDays: num($("#sSlow").value) || 45, deadDays: num($("#sDead").value) || 90 }); await saveSettings(); toast("✓ Saved"); render(); };
  }
  $("#dBack", el).onclick = () => download(`scm_backup_${today()}.json`, JSON.stringify({ app: "sew-scm", at: new Date().toISOString(), items: DB.items, suppliers: DB.suppliers, prices: DB.prices, txns: DB.txns, settings: DB.settings }, null, 1), "application/json");
  const rs_ = $("#dRest", el); if (rs_) rs_.onclick = () => { const f = document.createElement("input"); f.type = "file"; f.accept = ".json"; f.onchange = async () => { try { const d = JSON.parse(await f.files[0].text()); if (d.app !== "sew-scm") throw new Error("Not an SCM backup"); if (!confirmBox(`Restore ${d.items.length} items, ${d.txns.length} entries, ${d.prices.length} prices? Existing records with the same id are overwritten.`)) return; for (const c of COLLS) await put(c, d[c] || []); DB.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {}); await saveSettings(); toast("✓ Restored"); render(); } catch (e) { toast("Restore failed: " + e.message, true); } }; f.click(); };
  const sd = $("#dSeed", el); if (sd) sd.onclick = async () => { const n = await loadSeed(); toast(`✓ Loaded ${n} records`); render(); };
  const rr = $("#dReset", el); if (rr) rr.onclick = () => { if (confirmBox("Clear all demo data in this browser?")) { lsSet("scm-demo-db", ""); location.reload(); } };
  const cs = $("#cfgSave", el); if (cs) cs.onclick = () => { const url = $("#cfgU").value.trim(), key = $("#cfgK").value.trim(); if (!/^https:\/\/.+\.supabase\.co\/?$/.test(url)) { toast("URL should look like https://xxxx.supabase.co", true); return; } if (/service_role|sb_secret/i.test(key)) { toast("That is the secret key — use the publishable key", true); return; } lsSet("scm-config", JSON.stringify({ url: url.replace(/\/$/, ""), key })); location.reload(); };
} };

/* ---------------- users ---------------- */
PAGES.users = { async render(el) {
  if (S.mode === "demo") { el.innerHTML = pageHead("Users") + `<div class="panel"><div class="empty">Users work after the app is connected to Supabase. In demo mode everyone is admin on their own browser.</div></div>`; return; }
  if (!can("users")) { el.innerHTML = pageHead("Users") + `<div class="panel"><div class="empty">Only the admin manages users.</div></div>`; return; }
  el.innerHTML = pageHead("Users", "Who can open the SCM dashboard") + `<div class="panel"><div class="panel-head"><h2>People</h2><div class="right"><button class="btn btn-sm" id="usRef">↻</button></div></div><div id="usList" class="panel-body">Loading…</div>
    <div class="panel-body" style="border-top:1px solid var(--border)"><div class="form-grid"><div class="field"><label>Name</label><input class="inp" id="unName"></div><div class="field"><label>Email</label><input class="inp" id="unEmail" type="email"></div><div class="field"><label>Role</label><select class="inp" id="unRole">${Object.entries(ROLES).map(([k, l]) => `<option value="${k}"${k === "scm" ? " selected" : ""}>${l}</option>`).join("")}</select></div><div class="field"><label>Department (opens first)</label><select class="inp" id="unDept"><option value="">—</option>${DB.settings.depts.map(d => `<option>${esc(d)}</option>`).join("")}</select></div></div>
    <button class="btn btn-brand" id="unAdd" style="margin-top:12px">＋ Add person</button>
    <div class="tip" style="margin-top:14px">Then in Supabase → <b>Authentication → Users → Add user → Create new user</b>: same email, a password, tick <b>Auto Confirm User</b>. Give the password to the person.<br><b>SCM Head</b> — everything incl. prices · <b>SCM Staff</b> — receive, issue, surface treatment, count; cannot change prices · <b>View only</b> — departments, finance, management.</div></div></div>`;
  const load = async () => {
    const { data, error } = await S.sb.from("scm_users").select("email,full_name,role,dept").order("role").order("full_name");
    const box = $("#usList"); if (!box) return;
    if (error) { box.textContent = "Could not load: " + error.message; return; }
    box.innerHTML = `<div class="tw"><table class="t"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th></th></tr></thead><tbody>${data.map(u => { const self = u.email.toLowerCase() === S.email.toLowerCase(); return `<tr><td>${esc(u.full_name || "")}</td><td class="mono">${esc(u.email)}</td><td><select class="inp" data-role="${esc(u.email)}"${self ? " disabled" : ""}>${Object.entries(ROLES).map(([k, l]) => `<option value="${k}"${k === u.role ? " selected" : ""}>${l}</option>`).join("")}</select></td><td><select class="inp" data-udept="${esc(u.email)}"><option value="">—</option>${DB.settings.depts.map(d => `<option${d === u.dept ? " selected" : ""}>${esc(d)}</option>`).join("")}</select></td><td class="act">${self ? "you" : `<button class="btn btn-sm btn-danger" data-urm="${esc(u.email)}">Remove</button>`}</td></tr>`; }).join("")}</tbody></table></div>`;
    $$("[data-role]", box).forEach(s => s.onchange = async () => { const { error } = await S.sb.from("scm_users").update({ role: s.value }).eq("email", s.dataset.role); toast(error ? "Not saved: " + error.message : "✓ Role changed", !!error); });
    $$("[data-udept]", box).forEach(s => s.onchange = async () => { const { error } = await S.sb.from("scm_users").update({ dept: s.value }).eq("email", s.dataset.udept); toast(error ? "Not saved: " + error.message : "✓ Saved", !!error); });
    $$("[data-urm]", box).forEach(b => b.onclick = async () => { if (!confirmBox(`Remove ${b.dataset.urm}? They will not be able to open the dashboard.`)) return; const { error } = await S.sb.from("scm_users").delete().eq("email", b.dataset.urm); toast(error ? error.message : "Removed", !!error); load(); });
  };
  $("#usRef").onclick = load;
  $("#unAdd").onclick = async () => { const name = $("#unName").value.trim(), email = $("#unEmail").value.trim().toLowerCase(); if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast("Type name and a valid email", true); return; } const { error } = await S.sb.from("scm_users").upsert({ email, full_name: name, role: $("#unRole").value, dept: $("#unDept").value }, { onConflict: "email" }); if (error) { toast(error.message, true); return; } toast(`✓ ${name} added — now create the login in Supabase`); $("#unName").value = ""; $("#unEmail").value = ""; load(); };
  load();
} };

/* ---------------- user menu, theme, boot ---------------- */
function userMenu() {
  const body = `<div class="ic-stats"><div><span>Name</span><b>${esc(S.name)}</b></div><div><span>Role</span><b>${esc(ROLES[S.role] || S.role)}</b></div></div><div class="note">${esc(S.email || "Demo mode — no login")}</div>${S.mode === "cloud" ? `<div class="form-grid" style="margin-top:14px"><div class="field"><label>New password</label><input class="inp" type="password" id="umP1" autocomplete="new-password"></div><div class="field"><label>Again</label><input class="inp" type="password" id="umP2" autocomplete="new-password"></div></div>` : ""}`;
  const m = modal("Account", body, `${S.mode === "cloud" ? `<button class="btn" id="umPass">Change password</button><button class="btn btn-danger" id="umOut">Sign out</button>` : ""}<button class="btn btn-brand" data-close>Close</button>`);
  $$("[data-close]", m).forEach(b => b.onclick = closeModal);
  const o = $("#umOut"); if (o) o.onclick = async () => { await S.sb.auth.signOut(); location.reload(); };
  const p = $("#umPass"); if (p) p.onclick = async () => { const a = $("#umP1").value, b = $("#umP2").value; if (a.length < 8) { toast("At least 8 characters", true); return; } if (a !== b) { toast("The two passwords are different", true); return; } const { error } = await S.sb.auth.updateUser({ password: a }); toast(error ? error.message : "✓ Password changed", !!error); if (!error) closeModal(); };
}
function applyTheme(t) { document.documentElement.setAttribute("data-theme", t); $("#themeBtn").textContent = t === "dark" ? "☀️" : "🌙"; lsSet("scm-theme", t); }
async function afterLogin(session) {
  S.user = session.user; S.email = (session.user.email || "").toLowerCase();
  const { data, error } = await S.sb.from("scm_users").select("full_name,role,dept").eq("email", S.email).maybeSingle();
  if (error || !data) { $("#login").classList.remove("hide"); $("#lgErr").textContent = error ? "Could not check access: " + error.message : "This email is not on the SCM user list. Ask the admin to add you."; await S.sb.auth.signOut(); return; }
  S.name = data.full_name || S.email; S.role = data.role; S.dept = data.dept || "";
  $("#login").classList.add("hide");
  try { await loadAll(); } catch (e) { toast("Could not load data: " + e.message, true); }
  subscribe(); startApp();
}
function startApp() {
  buildNav();
  const last = lsGet("scm-page"); const [p] = (last || "").split(":");
  if (S.role === "viewer" && S.dept && !last) { DF.dept = S.dept; goTo("depts"); }
  else goTo(last && PAGES[p] ? last : "overview");
}
async function boot() {
  applyTheme(lsGet("scm-theme") || "light");
  $("#themeBtn").onclick = () => applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  $("#menuBtn").onclick = () => $("#nav").classList.contains("open") ? closeNav() : openNav();
  $("#navBd").onclick = closeNav;
  $("#modalBd").addEventListener("mousedown", e => { if (e.target.id === "modalBd") closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { if (AC) acClose(); else if ($("#modalBd").classList.contains("show")) closeModal(); else closeNav(); } });
  $("#userBtn").onclick = userMenu;
  const c = cfg();
  if (c && window.supabase) {
    S.mode = "cloud"; S.sb = window.supabase.createClient(c.url, c.key);
    const go = async () => { $("#lgErr").textContent = ""; $("#lgBtn").disabled = true; const { data, error } = await S.sb.auth.signInWithPassword({ email: $("#lgEmail").value.trim(), password: $("#lgPass").value }); $("#lgBtn").disabled = false; if (error) { $("#lgErr").textContent = error.message === "Invalid login credentials" ? "Wrong email or password." : error.message; return; } afterLogin(data.session); };
    $("#lgBtn").onclick = go; $("#lgPass").onkeydown = e => { if (e.key === "Enter") go(); };
    const { data } = await S.sb.auth.getSession();
    if (data.session) afterLogin(data.session); else $("#login").classList.remove("hide");
    renderChrome();
  } else {
    S.mode = "demo";
    if (!demoLoad()) { DB.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS)); }
    if (!DB.items.length) await loadSeed();
    bump(); startApp();
  }
}
document.addEventListener("DOMContentLoaded", () => {
  boot();
  setTimeout(() => { const sp = document.getElementById("splash"); if (!sp) return; sp.classList.add("gone"); setTimeout(() => sp.remove(), 800); }, 2600);
});

</script>
</body>
